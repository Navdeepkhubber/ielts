<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTSBand — Content Review</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">
<style>
:root{--bg:#eef0f3;--border:#dfe4ea;--text:#182230;--muted:#667085;--blue:#173b68;--blue-soft:#eef6ff;--green:#16804f;--green-border:#ccebd9;--warn:#a15c00;--warn-bg:#fff8e8}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text)}.review-page{height:100vh;display:flex;flex-direction:column;overflow:hidden}.review-toolbar{background:#fff;border-bottom:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.review-brand h1{margin:0;font:800 1.15rem/1.2 var(--font-display),Inter,system-ui,sans-serif}.review-brand p{margin:3px 0 0;color:var(--muted);font-size:.75rem}.review-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.review-controls select,.review-controls button{height:34px;border:1px solid #d5d9e0;border-radius:6px;background:#fff;color:#202124;padding:0 10px;font:inherit;font-size:.8rem}.review-controls select{min-width:120px}.review-controls button{cursor:pointer;font-weight:600}.review-controls button.active{background:var(--blue);border-color:var(--blue);color:#fff}.nav-btn{min-width:34px}.review-status{padding:5px 9px;border-radius:999px;background:#f1f3f5;color:var(--muted);font:600 .72rem var(--font-mono);white-space:nowrap}.review-layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--border)}.review-pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}.pane-head{min-height:46px;padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.pane-head strong{font:800 .84rem var(--font-display),Inter,system-ui,sans-serif}.pane-meta{color:var(--muted);font:.7rem var(--font-mono)}.pane-body{min-height:0;overflow:auto}.book-pane{background:#eef0f3;padding:18px}.book-page{margin:0 auto 18px;max-width:900px}.book-page img{display:block;width:100%;height:auto;background:#fff;border:1px solid #d7dbe1;box-shadow:0 2px 8px rgba(16,24,40,.1);min-height:80px}.page-error{padding:16px;border:1px solid #f0c36d;background:#fff8e8;color:#7a4b00;font-size:.8rem}.text-pane{background:#fff}.document{width:min(100%,760px);margin:0 auto;padding:22px 22px 50px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text)}.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}.doc-kicker{font-size:1.05rem;font-weight:800;line-height:1.25}.qa-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--green-border);border-radius:999px;background:#ecfbf2;color:var(--green);font-size:.72rem;font-weight:800;white-space:nowrap}.qa-badge.check{border-color:#f2d49d;background:var(--warn-bg);color:var(--warn)}.qa-badge.legacy{border-color:#dfe3e8;background:#f5f6f8;color:#667085}.book-heading{margin:20px 0 9px;font-size:.82rem;font-weight:800;line-height:1.3;text-transform:uppercase}.book-title{margin:18px 0 8px;font-size:1.12rem;line-height:1.3;font-weight:800}.book-instruction{margin:0 0 17px;padding:12px 14px;border:1px solid #cfe2ff;border-radius:8px;background:var(--blue-soft);color:#18345b;font-size:.84rem;line-height:1.5}.book-paragraph{margin:0 0 14px;color:#263445;font-size:.94rem;line-height:1.58}.question-group{margin:24px 0 22px;border:1px solid var(--green-border);border-radius:8px;overflow:hidden;background:#fff}.question-group-head{padding:14px 16px 11px;border-bottom:1px solid #dcefe3}.question-group-title{margin:0;color:var(--green);font-size:1rem;font-weight:800}.question-row{display:grid;grid-template-columns:34px minmax(0,1fr) 58px;gap:10px;align-items:start;padding:12px;border-top:1px solid #e8edf0;background:#fff}.question-row-number{display:flex;align-items:center;justify-content:center;min-height:28px;border-radius:6px;background:var(--blue);color:#fff;font-size:.76rem;font-weight:800}.question-row-text{font-size:.9rem;line-height:1.55;color:#263445;padding-top:2px}.question-row-answer{height:30px;display:flex;align-items:center;justify-content:center;border:1px dashed #c7d0d9;border-radius:5px;color:#8a96a3;font-size:.64rem;font-weight:700}.inline-gap{display:inline-block;min-width:78px;margin:0 3px;border-bottom:1px solid #8a96a3}.legacy-note{margin:0 0 14px;padding:9px 12px;border:1px solid #e2e6eb;border-radius:7px;background:#f8f9fa;color:#667085;font-size:.72rem}.repair-note{margin:0 0 14px;padding:9px 12px;border:1px solid #f2d49d;border-radius:7px;background:var(--warn-bg);color:var(--warn);font-size:.72rem}.qa-summary{margin-top:22px;padding:13px 14px;border:1px solid #d7e8fb;border-radius:8px;background:#eef6ff}.qa-summary-title{font-size:.88rem;font-weight:800;margin-bottom:7px}.qa-summary-details{display:flex;flex-wrap:wrap;gap:16px;color:#34495e;font-size:.78rem}.qa-summary-details strong{color:#182230}.raw-content{margin:0;padding:25px 30px 60px;white-space:pre-wrap;overflow-wrap:anywhere;font:.78rem/1.65 var(--font-mono)}.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:.82rem}@media(max-width:1000px){.review-layout{grid-template-columns:1fr;overflow:auto}.review-page{height:auto;min-height:100vh;overflow:visible}.review-pane{min-height:70vh}}@media(max-width:640px){.document{padding:18px 14px 40px}.question-row{grid-template-columns:30px minmax(0,1fr)}.question-row-answer{display:none}}
</style>
</head>
<body>
<div class="review-page">
<header class="review-toolbar"><div class="review-brand"><h1>Content Review</h1><p>Original source ↔ structured IELTS content</p></div><div class="review-controls"><select id="mockSelect"><option>Loading mocks…</option></select><select id="testSelect"><option>Select test…</option></select><select id="sectionSelect"><option value="reading">Reading</option><option value="listening">Listening</option></select><button id="prevBtn" class="nav-btn">←</button><button id="nextBtn" class="nav-btn">→</button><button id="textMode" class="active">Formatted</button><button id="rawMode">Raw</button><span id="status" class="review-status">Loading…</span></div></header>
<main class="review-layout"><section class="review-pane"><div class="pane-head"><strong>Original book</strong><span id="pageLabel" class="pane-meta"></span></div><div class="pane-body book-pane" id="bookPane"></div></section><section class="review-pane"><div class="pane-head"><strong id="textTitle">Extracted content</strong><span id="questionLabel" class="pane-meta"></span></div><div class="pane-body text-pane" id="textPane"></div></section></main>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);let mocks=[],current=null,sectionData=[],index=0,mode='structured',pageBust=Date.now();
async function api(path){const r=await fetch(path,{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function gaps(v){return esc(v).replace(/\b(\d{1,2})\s*(?:[.…·]{3,}|_{3,})/g,'<span class="inline-gap"></span>')}
function instruction(v){return /^(you should|complete|choose|write|look at|do the following|answer the questions)/i.test(String(v||'').trim())}
function passageHead(v){return /^(reading passage|section|part)\s+\d+/i.test(String(v||'').trim())}
function upper(v){const s=String(v||'').trim();return /^[A-Z][A-Z\s'.,\-:()]{4,80}$/.test(s)&&s.length<=80}
function expectedRange(range){const a=Number(range?.[0]),b=Number(range?.[1]);return Number.isInteger(a)&&Number.isInteger(b)&&a<=b?Array.from({length:b-a+1},(_,i)=>a+i):[]}
function recomputeQA(qs,range){const expected=expectedRange(range),seen=new Set(),dupes=[];const detected=qs.map(q=>Number(q.question));for(const n of detected){if(seen.has(n))dupes.push(n);seen.add(n)}const missing=expected.filter(n=>!seen.has(n));const unexpected=detected.filter(n=>!expected.includes(n));return {expected_count:expected.length,detected_count:detected.length,expected_questions:expected,detected_questions:detected,missing_questions:missing,duplicate_questions:dupes,unexpected_questions:unexpected,ordered:detected.join(',')===expected.join(','),ok:expected.length>0&&detected.length===expected.length&&!missing.length&&!dupes.length&&!unexpected.length}}

/* The extractor currently treats a group such as "Questions 1-7" as seven
   questions sharing one text blob. Repair that representation for review by
   splitting the shared OCR text at the actual numbered markers. */
function repairGroupedQuestions(qs,range){
  const expected=expectedRange(range);if(!expected.length||!qs?.length)return {questions:qs||[],repaired:false};
  const groups=new Map();for(const q of qs){const key=String(q.text||'').replace(/\s+/g,' ').trim();if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q)}
  const result=[];let repaired=false;
  for(const [text,members] of groups){
    const header=text.match(/(?:questions?|qns?)\s+(\d{1,2})\s*(?:to|[-–—]|and|&)\s*(\d{1,2})\b/i);
    if(members.length<2||!header){result.push(...members);continue}
    const start=Number(header[1]),end=Number(header[2]);const wanted=expected.filter(n=>n>=start&&n<=end);if(!wanted.length){result.push(...members);continue}
    const body=text.replace(/^\s*(?:questions?|qns?)\s+\d{1,2}\s*(?:to|[-–—]|and|&)\s*\d{1,2}\b[^\n]*/i,'').replace(/\s+/g,' ').trim();
    const found=[];let cursor=0;
    for(const n of wanted){const re=new RegExp('(?:^|\\s)'+n+'\\s*(?:[.)/:]|(?=\\s))\\s*(?=[A-Za-z_])','i');const m=re.exec(body.slice(cursor));if(!m)continue;const pos=cursor+m.index+(m[0].startsWith(' ')?1:0);found.push({n,pos,end:cursor+m.index+m[0].length});cursor=cursor+m.index+m[0].length}
    if(found.length>=2){
      for(let i=0;i<found.length;i++){const f=found[i],next=found[i+1];let t=body.slice(f.end,next?next.pos:body.length).trim();t=t.replace(/^[-–—:*]+\s*/,'').trim();if(t)result.push({question:f.n,text:t,page:members[0].page});}
      repaired=true;
    }else result.push(...members);
  }
  result.sort((a,b)=>Number(a.question)-Number(b.question));return {questions:result,repaired};
}
function blocksHtml(blocks){return (blocks||[]).map(b=>{const raw=String(b?.text||'').trim();if(!raw)return '';if(passageHead(raw)||upper(raw))return `<div class="book-heading">${gaps(raw)}</div>`;if(instruction(raw))return `<div class="book-instruction">${gaps(raw)}</div>`;return `<p class="book-paragraph">${gaps(raw)}</p>`}).join('')}
function questionsHtml(qs){if(!qs?.length)return '';const first=qs[0].question,last=qs[qs.length-1].question;return `<section class="question-group"><div class="question-group-head"><h3 class="question-group-title">Questions ${first}–${last}</h3></div>${qs.map(q=>`<div class="question-row"><div class="question-row-number">${esc(q.question)}</div><div class="question-row-text">${gaps(q.text)}</div><div class="question-row-answer">Answer</div></div>`).join('')}</section>`}
function qaHtml(qa,repaired){return `<section class="qa-summary"><div class="qa-summary-title">${qa.ok?'✓':'!'} QA Summary</div><div class="qa-summary-details"><span>Detected: <strong>${qa.detected_count||0}</strong></span><span>Expected: <strong>${qa.expected_count||0}</strong></span><span>Missing: <strong>${qa.missing_questions?.length||0}</strong></span><span>Duplicates: <strong>${qa.duplicate_questions?.length||0}</strong></span><span>Unexpected: <strong>${qa.unexpected_questions?.length||0}</strong></span></div></section>${repaired?'<div class="repair-note">The stored structured questions contained duplicated group text. This view split the group for review; regenerate the content JSON to persist the corrected question boundaries.</div>':''}`}
function pagesHtml(pages){if(!pages?.length)return '<div class="empty">No page numbers configured.</div>';return pages.map(p=>`<div class="book-page" data-page="${esc(p)}"><img src="/api/mocks/${encodeURIComponent(current.mock)}/page?page=${encodeURIComponent(p)}&v=${pageBust}" alt="Original PDF page ${esc(p)}"></div>`).join('')}
function wirePages(){document.querySelectorAll('#bookPane img').forEach(img=>img.addEventListener('error',()=>{const p=img.closest('.book-page')?.dataset.page||'?';img.parentElement.innerHTML=`<div class="page-error"><strong>Could not render PDF page ${esc(p)}.</strong><br>Check the blob PDF and the server PDF-render endpoint for page ${esc(p)}.</div>`},{once:true}))}
async function loadMocks(){mocks=await api('/api/mocks');$('mockSelect').innerHTML=mocks.map(m=>`<option value="${esc(m.id||m.mock_id||m.name)}">${esc(m.name||m.id||m.mock_id)}</option>`).join('');await loadTests()}
async function loadTests(){const id=$('mockSelect').value;const cfg=await api('/api/mocks/'+encodeURIComponent(id));const tests=Object.keys(cfg.tests||{});$('testSelect').innerHTML=tests.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');await loadSection()}
async function loadSection(){const mock=$('mockSelect').value,test=$('testSelect').value,section=$('sectionSelect').value;if(!mock||!test)return;current={mock,test,section};pageBust=Date.now();try{const[content,cfg]=await Promise.all([api('/api/mocks/'+encodeURIComponent(mock)+'/tests/'+encodeURIComponent(test)+'/content'),api('/api/mocks/'+encodeURIComponent(mock)+'/tests/'+encodeURIComponent(test))]);const extracted=section==='reading'?(content.reading?.passages||[]):(content.listening?.parts||[]);const configured=section==='reading'?(cfg.reading?.passages||[]):(cfg.listening?.parts||[]);sectionData=configured.map((c,i)=>({...((extracted[i])||{}),pages:c.pages||[],label:section==='reading'?`Passage ${i+1}`:`Part ${i+1}`,question_range:c.questions||null}));index=0;render()}catch(e){$('bookPane').innerHTML='<div class="empty">Could not load this section.</div>';$('textPane').innerHTML=`<div class="empty">${esc(e.message)}</div>`;$('status').textContent='Load failed'}}
function render(){const s=sectionData[index],section=current?.section||'reading';if(!s){$('bookPane').innerHTML='<div class="empty">No section configured.</div>';$('textPane').innerHTML='<div class="empty">No extracted content available.</div>';return}$('pageLabel').textContent=s.pages?.length?`Pages ${s.pages.join(', ')}`:'';$('textTitle').textContent=`${s.label} · ${mode==='structured'?'Formatted text':'Raw extracted text'}`;$('status').textContent=`${index+1} / ${sectionData.length}`;$('bookPane').innerHTML=pagesHtml(s.pages);wirePages();if(mode==='raw'){$('questionLabel').textContent=s.text?'Raw extraction':'0 detected questions';$('textPane').innerHTML=`<pre class="raw-content">${esc(s.text||'')}</pre>`;return}
  let qs=s.questions||[],repair=false;if(qs.length&&s.question_range){const r=repairGroupedQuestions(qs,s.question_range);qs=r.questions;repair=r.repaired}const qa=recomputeQA(qs,s.question_range||null);$('questionLabel').textContent=qs.length?`${qs.length} detected questions`:(s.text?'Text extraction':'0 detected questions');const badge=qa.expected_count?`<span class="qa-badge ${qa.ok?'':'check'}">${qa.ok?'✓ PASS':'! CHECK'} · ${qa.detected_count} / ${qa.expected_count} questions</span>`:`<span class="qa-badge legacy">Text extraction</span>`;const body=blocksHtml(s.blocks)+questionsHtml(qs)+qaHtml(qa,repair);$('textPane').innerHTML=`<article class="document"><div class="doc-head"><div class="doc-kicker">${section==='reading'?'READING PASSAGE':'LISTENING SECTION'} ${index+1}</div>${badge}</div><div>${body}</div></article>`}
$('mockSelect').addEventListener('change',loadTests);$('testSelect').addEventListener('change',loadSection);$('sectionSelect').addEventListener('change',loadSection);$('prevBtn').addEventListener('click',()=>{if(index>0){index--;render()}});$('nextBtn').addEventListener('click',()=>{if(index<sectionData.length-1){index++;render()}});$('textMode').addEventListener('click',()=>{mode='structured';$('textMode').classList.add('active');$('rawMode').classList.remove('active');render()});$('rawMode').addEventListener('click',()=>{mode='raw';$('rawMode').classList.add('active');$('textMode').classList.remove('active');render()});loadMocks().catch(e=>{console.error(e);$('status').textContent='Load failed'})
})();
</script>
</body>
</html>

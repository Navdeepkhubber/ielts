<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTSBand — Content Review</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">
<style>
  body { background: var(--paper); }
  .review-page { max-width: 1600px; margin: 0 auto; padding: 24px; }
  .review-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; }
  .review-head h1 { margin:0 0 4px; font-family:var(--font-display); font-size:1.6rem; }
  .review-head p { margin:0; color:var(--ink-soft); }
  .review-controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .review-controls select, .review-controls button { height:38px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink); padding:0 12px; font:inherit; }
  .review-controls button { cursor:pointer; font-weight:600; }
  .review-controls button.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .review-layout { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:16px; min-height:72vh; align-items:start; }
  .review-pane { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-1); overflow:hidden; min-width:0; }
  .pane-head { padding:11px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--surface); position:sticky; top:0; z-index:2; }
  .pane-head strong { font-family:var(--font-display); }
  .pane-meta { font-size:.78rem; color:var(--ink-soft); font-family:var(--font-mono); }
  .pane-body { padding:16px; overflow:auto; max-height:78vh; }
  .book-page { margin:0 auto 16px; }
  .book-page img { display:block; width:100%; max-width:1000px; margin:0 auto; border:1px solid var(--line); border-radius:4px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .book-page img.is-loading { min-height:120px; }
  .page-error { padding:16px; border:1px solid #e5c9a8; border-radius:8px; background:#fff7ed; color:#7c4a12; font-size:.84rem; }
  .page-error code { font-family:var(--font-mono); font-size:.76rem; }
  .structured-content { font-size:1rem; line-height:1.7; }
  .content-intro { padding:12px 14px; margin-bottom:14px; border:1px solid var(--line); border-radius:8px; background:var(--paper); }
  .content-intro-row { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
  .content-title { font-family:var(--font-display); font-weight:700; }
  .qa-badge { display:inline-flex; align-items:center; gap:5px; font-size:.76rem; font-family:var(--font-mono); font-weight:700; padding:4px 8px; border-radius:999px; }
  .qa-ok { background:#e9f7ee; color:#146c35; }
  .qa-check { background:#fff0df; color:#8a4b08; }
  .qa-legacy { background:#edf2f7; color:#475569; }
  .qa-detail { font-size:.78rem; color:var(--ink-soft); margin-top:7px; }
  .prose-block { margin:0 0 15px; }
  .prose-block:last-child { margin-bottom:18px; }
  .prose-heading { font-family:var(--font-display); font-weight:750; line-height:1.35; margin-top:20px; }
  .question-list { margin-top:16px; }
  .question-section-label { font-family:var(--font-display); font-weight:700; font-size:1.05rem; margin:0 0 10px; padding-bottom:7px; border-bottom:1px solid var(--line); }
  .review-question { display:grid; grid-template-columns:44px minmax(0,1fr); gap:11px; border:1px solid var(--line); border-radius:8px; padding:12px; margin:0 0 10px; background:#fff; }
  .review-question-num { font-weight:800; font-family:var(--font-mono); color:var(--navy-btn); }
  .review-question-body { min-width:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .legacy-content { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.75; }
  .raw-content { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:inherit; line-height:1.65; }
  .review-empty { padding:30px; text-align:center; color:var(--ink-soft); }
  .status { font-size:.78rem; color:var(--ink-soft); }
  .review-note { font-size:.8rem; color:var(--ink-soft); margin:0 0 12px; }
  @media (max-width:1100px) { .review-layout { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
  @media (max-width:900px) { .review-layout { grid-template-columns:1fr; } .pane-body { max-height:none; } }
</style>
</head>
<body>
  <div class="review-page">
    <div class="review-head">
      <div>
        <h1>Content Review</h1>
        <p>View the original PDF and its structured extraction side by side.</p>
      </div>
      <div class="review-controls">
        <select id="mockSelect"><option>Loading mocks…</option></select>
        <select id="testSelect"><option>Select test…</option></select>
        <select id="sectionSelect"><option value="reading">Reading</option><option value="listening">Listening</option></select>
        <button id="prevBtn">← Previous</button>
        <button id="nextBtn">Next →</button>
      </div>
    </div>

    <div class="review-controls" style="margin-bottom:12px">
      <button id="textMode" class="active">Formatted text</button>
      <button id="rawMode">Raw extracted text</button>
      <span id="status" class="status"></span>
    </div>

    <p class="review-note">The left pane always shows the source PDF page(s); the right pane shows the corresponding extracted content, questions, and QA status.</p>

    <div class="review-layout">
      <section class="review-pane">
        <div class="pane-head">
          <strong>Original book</strong>
          <span id="pageLabel" class="pane-meta"></span>
        </div>
        <div class="pane-body book-pages" id="bookPane"></div>
      </section>

      <section class="review-pane">
        <div class="pane-head">
          <strong id="textTitle">Extracted content</strong>
          <span id="questionLabel" class="pane-meta"></span>
        </div>
        <div class="pane-body structured-content" id="textPane"></div>
      </section>
    </div>
  </div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let mocks = [], current = null, sectionData = [], index = 0, mode = 'structured';

  async function api(path) {
    const r = await fetch(path, { credentials: 'same-origin' });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function looksLikeHeading(text) {
    const value = String(text || '').trim();
    if (!value) return false;
    return /^(questions?|reading passage|section|part)\b/i.test(value) ||
           /^(complete|choose|write|look at|do the following)\b/i.test(value) ||
           (/^[A-Z][A-Z\s'.,\-:()]{4,80}$/.test(value) && value.length <= 80);
  }

  function renderProse(blocks) {
    return (blocks || []).map(block => {
      const text = String(block?.text || '').trim();
      if (!text) return '';
      const cls = looksLikeHeading(text) ? 'prose-block prose-heading' : 'prose-block';
      return `<div class="${cls}">${esc(text)}</div>`;
    }).join('');
  }

  function renderQuestions(questions) {
    if (!questions?.length) return '';
    const cards = questions.map(q => `
      <div class="review-question">
        <div class="review-question-num">${esc(q.question)}</div>
        <div class="review-question-body">${esc(q.text)}</div>
      </div>
    `).join('');
    return `<div class="question-list"><div class="question-section-label">Questions</div>${cards}</div>`;
  }

  function renderLegacyText(text) {
    const value = String(text || '').trim();
    if (!value) return '<div class="review-empty">No extracted text available.</div>';
    return `<div class="legacy-content">${esc(value)}</div>`;
  }

  function renderPages(pages) {
    if (!pages?.length) {
      return '<div class="review-empty">No page numbers configured.</div>';
    }
    return pages.map(page => `
      <div class="book-page" data-page="${page}">
        <img class="is-loading" src="/api/mocks/${encodeURIComponent(current.mock)}/page?page=${page}" alt="Original PDF page ${page}" loading="eager">
      </div>
    `).join('');
  }

  function wirePageErrors() {
    document.querySelectorAll('#bookPane img').forEach(img => {
      img.addEventListener('load', () => img.classList.remove('is-loading'), { once: true });
      img.addEventListener('error', () => {
        const page = img.closest('.book-page')?.dataset.page || '?';
        const holder = img.parentElement;
        holder.innerHTML = `<div class="page-error"><strong>Could not render PDF page ${esc(page)}.</strong><br>` +
          `The source PDF could not be served by the local content endpoint.<br>` +
          `<code>/api/mocks/${esc(current.mock)}/page?page=${esc(page)}</code></div>`;
      }, { once: true });
    });
  }

  async function loadMocks() {
    mocks = await api('/api/mocks');
    $('mockSelect').innerHTML = mocks.map(m =>
      `<option value="${esc(m.id || m.mock_id || m.name)}">${esc(m.name || m.id || m.mock_id)}</option>`
    ).join('');
    await loadTests();
  }

  async function loadTests() {
    const id = $('mockSelect').value;
    const cfg = await api('/api/mocks/' + encodeURIComponent(id));
    const tests = Object.keys(cfg.tests || {});
    $('testSelect').innerHTML = tests.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
    await loadSection();
  }

  async function loadSection() {
    const mock = $('mockSelect').value;
    const test = $('testSelect').value;
    const section = $('sectionSelect').value;
    if (!mock || !test) return;

    current = {mock, test, section};
    try {
      const [content, cfg] = await Promise.all([
        api('/api/mocks/' + encodeURIComponent(mock) + '/tests/' + encodeURIComponent(test) + '/content'),
        api('/api/mocks/' + encodeURIComponent(mock) + '/tests/' + encodeURIComponent(test))
      ]);
      const arr = section === 'reading' ? (content.reading?.passages || []) : (content.listening?.parts || []);
      const cfgArr = section === 'reading' ? (cfg.reading?.passages || []) : (cfg.listening?.parts || []);

      sectionData = cfgArr.map((cfgSection, i) => ({
        ...(arr[i] || {}),
        pages: cfgSection.pages || [],
        label: section === 'reading' ? `Passage ${i + 1}` : `Part ${i + 1}`
      }));
      index = 0;
      render();
    } catch (e) {
      $('bookPane').innerHTML = '<div class="review-empty">Could not load this section.</div>';
      $('textPane').innerHTML = `<div class="page-error">${esc(e.message)}</div>`;
      $('status').textContent = 'Load failed';
    }
  }

  function render() {
    const s = sectionData[index];
    if (!s) {
      $('bookPane').innerHTML = '<div class="review-empty">No section configured.</div>';
      $('textPane').innerHTML = '<div class="review-empty">No structured content available.</div>';
      return;
    }

    $('pageLabel').textContent = s.pages?.length ? `Pages ${s.pages.join(', ')}` : '';
    $('questionLabel').textContent = s.questions?.length ? `${s.questions.length} detected questions` : (s.text ? 'Legacy extracted text' : '0 detected questions');
    $('textTitle').textContent = `${s.label} · ${mode === 'structured' ? 'Formatted text' : 'Raw extracted text'}`;
    $('status').textContent = `${index + 1} / ${sectionData.length}`;

    $('bookPane').innerHTML = renderPages(s.pages);
    wirePageErrors();

    if (mode === 'raw') {
      $('textPane').innerHTML = `<pre class="raw-content">${esc(s.text || '')}</pre>`;
      return;
    }

    const qa = s.qa || {};
    const hasStructuredQa = Number.isFinite(qa.expected_count) && qa.expected_count > 0;
    let badge;
    let details = '';
    if (hasStructuredQa) {
      badge = `<span class="qa-badge ${qa.ok ? 'qa-ok' : 'qa-check'}">${qa.ok ? 'PASS' : 'CHECK'} · ${qa.detected_count || 0}/${qa.expected_count || 0}</span>`;
      details = [
        (qa.missing_questions || []).length ? `Missing: ${qa.missing_questions.join(', ')}` : '',
        (qa.duplicate_questions || []).length ? `Duplicates: ${qa.duplicate_questions.join(', ')}` : '',
        (qa.unexpected_questions || []).length ? `Unexpected: ${qa.unexpected_questions.join(', ')}` : ''
      ].filter(Boolean).join(' · ');
    } else {
      badge = '<span class="qa-badge qa-legacy">LEGACY · re-extraction needed</span>';
    }

    const qaHtml = `
      <div class="content-intro">
        <div class="content-intro-row">
          <span class="content-title">${esc(s.label)}</span>
          ${badge}
        </div>
        ${details ? `<div class="qa-detail">${esc(details)}</div>` : ''}
      </div>
    `;

    const prose = renderProse(s.blocks);
    const questions = renderQuestions(s.questions);
    let body = prose + questions;
    if (!body) {
      body = renderLegacyText(s.text);
    }
    $('textPane').innerHTML = qaHtml + body;
  }

  $('mockSelect').addEventListener('change', loadTests);
  $('testSelect').addEventListener('change', loadSection);
  $('sectionSelect').addEventListener('change', loadSection);
  $('prevBtn').addEventListener('click', () => { if (index > 0) { index--; render(); } });
  $('nextBtn').addEventListener('click', () => { if (index + 1 < sectionData.length) { index++; render(); } });

  $('textMode').addEventListener('click', () => {
    mode = 'structured';
    $('textMode').classList.add('active');
    $('rawMode').classList.remove('active');
    render();
  });
  $('rawMode').addEventListener('click', () => {
    mode = 'raw';
    $('rawMode').classList.add('active');
    $('textMode').classList.remove('active');
    render();
  });

  loadMocks().catch(e => { $('status').textContent = 'Error: ' + e.message; });
})();
</script>
</body>
</html>

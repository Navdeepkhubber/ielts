<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTSBand — Content Review</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">
<style>
  :root {
    --review-bg: #f5f7fa;
    --review-border: #e2e7ee;
    --review-muted: #667085;
    --review-text: #182230;
    --review-blue: #173b68;
    --review-blue-soft: #eef6ff;
    --review-green: #198754;
    --review-green-soft: #f2fbf6;
    --review-green-border: #ccebd9;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--review-bg); color: var(--review-text); }

  .review-page { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .review-toolbar {
    flex: 0 0 auto;
    background: #fff;
    border-bottom: 1px solid var(--review-border);
    padding: 11px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    z-index: 10;
  }

  .review-brand h1 {
    margin: 0;
    font-family: var(--font-display), Inter, system-ui, sans-serif;
    font-size: 1.15rem;
    line-height: 1.2;
  }
  .review-brand p { margin: 3px 0 0; color: var(--review-muted); font-size: .75rem; }

  .review-controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .review-controls select,
  .review-controls button {
    height: 34px;
    border: 1px solid #d5d9e0;
    border-radius: 6px;
    background: #fff;
    color: #202124;
    padding: 0 10px;
    font: inherit;
    font-size: .8rem;
  }
  .review-controls select { min-width: 120px; }
  .review-controls button { cursor: pointer; font-weight: 600; }
  .review-controls button:hover { background: #f7f8fa; }
  .review-controls button.active { background: var(--review-blue); border-color: var(--review-blue); color: #fff; }
  .review-controls .nav-btn { min-width: 34px; padding: 0 9px; }

  .review-status {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 0 9px;
    border-radius: 999px;
    background: #f1f3f5;
    color: var(--review-muted);
    font: 600 .72rem var(--font-mono);
    white-space: nowrap;
  }

  .review-layout {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px;
    background: var(--review-border);
  }

  .review-pane {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
  }

  .pane-head {
    flex: 0 0 auto;
    min-height: 46px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--review-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: rgba(255,255,255,.98);
    z-index: 5;
  }
  .pane-head strong { font-family: var(--font-display), Inter, system-ui, sans-serif; font-size: .84rem; }
  .pane-meta { color: var(--review-muted); font: .7rem var(--font-mono); }
  .pane-body { min-height: 0; overflow: auto; overscroll-behavior: contain; }

  /* Original PDF side */
  .book-pane { background: #eef0f3; padding: 18px; }
  .book-page { margin: 0 auto 18px; max-width: 900px; }
  .book-page img {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    border: 1px solid #d7dbe1;
    box-shadow: 0 2px 8px rgba(16,24,40,.10);
  }
  .book-page img.is-loading { min-height: 160px; }
  .page-error { padding: 16px; border: 1px solid #f0c36d; background: #fff8e8; color: #7a4b00; font-size: .8rem; }
  .page-error code { font-family: var(--font-mono); font-size: .7rem; }

  /* Structured text side — intentionally uses the same clean sans-serif visual language
     as the review UI, rather than the monospace/raw extraction styling. */
  .text-pane { background: #fff; }
  .document {
    width: min(100%, 900px);
    margin: 0 auto;
    padding: 18px 16px 34px;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #182230;
    font-size: 15px;
    line-height: 1.48;
  }

  .document-header {
    margin: 0 0 14px;
  }
  .document-kicker {
    margin: 0 0 10px;
    color: #182230;
    font-size: 1.22rem;
    line-height: 1.25;
    font-weight: 800;
    letter-spacing: -.015em;
  }
  .document-qa {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    min-height: 30px;
    margin: -38px 0 18px;
    font-size: .72rem;
    font-weight: 700;
  }
  .qa-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border: 1px solid var(--review-green-border);
    border-radius: 999px;
    background: #ecfbf2;
    color: var(--review-green);
    white-space: nowrap;
  }
  .qa-badge.check { border-color: #f2d49d; background: #fff8e8; color: #a15c00; }
  .qa-badge.legacy { border-color: #dfe3e8; background: #f5f6f8; color: #667085; }

  .document-body { min-width: 0; }

  .book-heading {
    margin: 18px 0 9px;
    color: #182230;
    font-size: .82rem;
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: .01em;
  }
  .book-heading.upper { text-transform: uppercase; }

  .book-instruction {
    margin: 0 0 18px;
    padding: 12px 14px;
    border: 1px solid #cfe2ff;
    border-radius: 8px;
    background: var(--review-blue-soft);
    color: #18345b;
    font-size: .84rem;
    line-height: 1.45;
    font-weight: 500;
  }
  .book-instruction::before {
    content: "i";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    margin-right: 9px;
    border-radius: 50%;
    background: #2f80ed;
    color: #fff;
    font-size: .68rem;
    font-weight: 800;
    vertical-align: -1px;
  }

  .book-title {
    margin: 18px 0 8px;
    color: #182230;
    font-size: 1.1rem;
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: -.01em;
  }

  .book-paragraph {
    margin: 0 0 12px;
    color: #263445;
    font-size: .91rem;
    line-height: 1.5;
    font-weight: 450;
    text-align: left;
  }
  .book-paragraph.section-letter { position: relative; padding-left: 27px; }
  .section-letter .letter { position: absolute; left: 0; top: 0; font-weight: 800; color: #182230; }

  .question-group {
    margin: 20px 0 22px;
    overflow: hidden;
    border: 1px solid var(--review-green-border);
    border-radius: 8px;
    background: linear-gradient(180deg, #f7fdf9 0%, #fff 100%);
  }
  .question-group-head {
    padding: 14px 16px 11px;
    border-bottom: 1px solid #dcefe3;
  }
  .question-group-title {
    margin: 0 0 8px;
    color: #16804f;
    font-size: 1rem;
    line-height: 1.3;
    font-weight: 800;
  }
  .question-group-instruction {
    margin: 0 0 4px;
    color: #374151;
    font-size: .84rem;
    line-height: 1.45;
    font-style: italic;
  }
  .question-group-instruction:last-child { margin-bottom: 0; }

  .question-row {
    display: grid;
    grid-template-columns: 30px minmax(0,1fr) 46px;
    gap: 8px;
    align-items: center;
    min-height: 44px;
    padding: 7px 12px;
    border-top: 1px solid #e8edf0;
    background: rgba(255,255,255,.92);
  }
  .question-row:first-of-type { border-top: 0; }
  .question-row-number { font-size: .82rem; font-weight: 800; color: #182230; }
  .question-row-text { min-width: 0; color: #263445; font-size: .86rem; line-height: 1.45; }
  .question-row-answer {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    border: 1px dashed #c7d0d9;
    border-radius: 5px;
    color: #6b7280;
    background: #fff;
    font-size: .68rem;
    font-weight: 700;
  }
  .inline-gap {
    display: inline-block;
    min-width: 82px;
    margin: 0 3px;
    border-bottom: 1px solid #8a96a3;
    vertical-align: baseline;
    line-height: .9;
  }
  .inline-gap-number { display: none; }

  .qa-summary {
    margin-top: 20px;
    padding: 13px 14px;
    border: 1px solid #d7e8fb;
    border-radius: 8px;
    background: #eef6ff;
    color: #243b53;
  }
  .qa-summary-title { display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:.88rem; font-weight:800; }
  .qa-summary-icon { width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #3b82c4; border-radius:50%; color:#2474b5; font-size:.7rem; font-weight:800; }
  .qa-summary-details { display:flex; flex-wrap:wrap; gap:16px; color:#34495e; font-size:.78rem; }
  .qa-summary-details strong { color:#182230; }

  .legacy-content {
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .legacy-notice { display:none; }
  .legacy-content p { margin:0 0 12px; color:#263445; font-size:.91rem; line-height:1.5; }
  .raw-content { margin:0; padding:25px 30px 60px; white-space:pre-wrap; overflow-wrap:anywhere; font:.78rem/1.65 var(--font-mono); }
  .review-empty { padding:40px 24px; text-align:center; color:var(--review-muted); font-size:.82rem; }

  @media(max-width:1000px) {
    .review-toolbar { align-items:flex-start; }
    .review-layout { grid-template-columns:1fr; overflow:auto; }
    .review-page { height:auto; min-height:100vh; overflow:visible; }
    .review-pane { min-height:70vh; }
    .book-pane { max-height:75vh; }
  }
  @media(max-width:640px) {
    .review-toolbar { padding:10px; }
    .review-controls { width:100%; }
    .review-controls select { flex:1; min-width:0; }
    .document { padding:18px 14px 40px; }
    .question-row { grid-template-columns:26px minmax(0,1fr); }
    .question-row-answer { display:none; }
  }
</style>
</head>
<body>
<div class="review-page">
  <header class="review-toolbar">
    <div class="review-brand">
      <h1>Content Review</h1>
      <p>Original source ↔ structured IELTS content</p>
    </div>
    <div class="review-controls">
      <select id="mockSelect" aria-label="Mock"><option>Loading mocks…</option></select>
      <select id="testSelect" aria-label="Test"><option>Select test…</option></select>
      <select id="sectionSelect" aria-label="Section">
        <option value="reading">Reading</option>
        <option value="listening">Listening</option>
      </select>
      <button class="nav-btn" id="prevBtn" title="Previous section">←</button>
      <button class="nav-btn" id="nextBtn" title="Next section">→</button>
      <button id="textMode" class="active">Formatted</button>
      <button id="rawMode">Raw</button>
      <span id="status" class="review-status">Loading…</span>
    </div>
  </header>

  <main class="review-layout">
    <section class="review-pane">
      <div class="pane-head">
        <strong>Original book</strong>
        <span id="pageLabel" class="pane-meta"></span>
      </div>
      <div class="pane-body book-pane" id="bookPane"></div>
    </section>

    <section class="review-pane">
      <div class="pane-head">
        <strong id="textTitle">Extracted content</strong>
        <span id="questionLabel" class="pane-meta"></span>
      </div>
      <div class="pane-body text-pane" id="textPane"></div>
    </section>
  </main>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let mocks = [], current = null, sectionData = [], index = 0, mode = "structured";

  async function api(path) {
    const r = await fetch(path, {credentials:"same-origin"});
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatGaps(v) {
    return esc(v).replace(/\b(\d{1,2})\s*(?:[.…·]{3,}|_{3,})/g,
      '<span class="inline-gap"><span class="inline-gap-number">$1</span></span>');
  }

  function isSingleLetter(v) { return /^[A-H]$/.test(String(v||"").trim()); }
  function isPassageHeading(v) { return /^(reading passage|section|part)\s+\d+/i.test(String(v||"").trim()); }
  function isQuestionRange(v) { return /^(questions?|qns?)\s*\d{1,2}\s*(?:and|&|to|[-–—])\s*\d{1,2}\b/i.test(String(v||"").trim()); }
  function isInstruction(v) { return /^(you should|complete|choose|write|look at|do the following|answer the questions)/i.test(String(v||"").trim()); }
  function looksUpper(v) { const s=String(v||"").trim(); return /^[A-Z][A-Z\s'.,\-:()]{4,80}$/.test(s) && s.length<=80; }

  function renderBlocks(blocks) {
    const out = [], arr = blocks || [];
    for (let i=0; i<arr.length; i++) {
      const raw = String(arr[i]?.text || "").trim();
      if (!raw) continue;
      if (isSingleLetter(raw) && i+1<arr.length) {
        const next = String(arr[i+1]?.text || "").trim();
        if (next && !isSingleLetter(next)) {
          out.push(`<p class="book-paragraph section-letter"><span class="letter">${esc(raw)}</span>${formatGaps(next)}</p>`);
          i++;
          continue;
        }
      }
      if (isPassageHeading(raw)) {
        out.push(`<div class="book-heading upper">${formatGaps(raw)}</div>`);
      } else if (isInstruction(raw)) {
        out.push(`<div class="book-instruction">${formatGaps(raw)}</div>`);
      } else if (i > 0 && isInstruction(String(arr[i-1]?.text || "").trim()) && raw.length <= 90) {
        out.push(`<h2 class="book-title">${formatGaps(raw)}</h2>`);
      } else if (looksUpper(raw)) {
        out.push(`<div class="book-heading upper">${formatGaps(raw)}</div>`);
      } else {
        out.push(`<p class="book-paragraph">${formatGaps(raw)}</p>`);
      }
    }
    return out.join("");
  }

  function splitLegacyBlocks(text) {
    return String(text || "").split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
  }

  function renderLegacy(text) {
    const blocks = splitLegacyBlocks(text);
    if (!blocks.length) return '<div class="review-empty">No extracted text available.</div>';
    return renderBlocks(blocks.map(text => ({text})));
  }

  function renderQuestions(questions) {
    if (!questions?.length) return "";
    const first = Number(questions[0].question);
    const last = Number(questions[questions.length-1].question);
    const title = Number.isFinite(first) && Number.isFinite(last) ? `Questions ${first}–${last}` : "Questions";

    const rows = questions.map(q => {
      const body = String(q.text || "").trim();
      const parts = body.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
      const text = parts.join(" ");
      return `<div class="question-row">
        <div class="question-row-number">${esc(q.question)}</div>
        <div class="question-row-text">${formatGaps(text)}</div>
        <div class="question-row-answer">${esc(q.question)}</div>
      </div>`;
    }).join("");

    return `<section class="question-group">
      <div class="question-group-head">
        <h3 class="question-group-title">${title}</h3>
      </div>
      ${rows}
    </section>`;
  }

  function renderQa(qa) {
    const structured = Number.isFinite(qa?.expected_count);
    if (!structured) return '';
    return `<section class="qa-summary">
      <div class="qa-summary-title"><span class="qa-summary-icon">✓</span> QA Summary</div>
      <div class="qa-summary-details">
        <span>Detected: <strong>${qa.detected_count || 0}</strong></span>
        <span>Expected: <strong>${qa.expected_count || 0}</strong></span>
        <span>Missing: <strong>${qa.missing_questions?.length || 0}</strong></span>
        <span>Duplicates: <strong>${qa.duplicate_questions?.length || 0}</strong></span>
        <span>Unexpected: <strong>${qa.unexpected_questions?.length || 0}</strong></span>
      </div>
    </section>`;
  }

  function renderPages(pages) {
    if (!pages?.length) return '<div class="review-empty">No page numbers configured.</div>';
    return pages.map(page => `<div class="book-page" data-page="${esc(page)}"><img class="is-loading" src="/api/mocks/${encodeURIComponent(current.mock)}/page?page=${encodeURIComponent(page)}" alt="Original PDF page ${esc(page)}" loading="eager"></div>`).join("");
  }

  function wirePageErrors() {
    document.querySelectorAll("#bookPane img").forEach(img => {
      img.addEventListener("load",()=>img.classList.remove("is-loading"),{once:true});
      img.addEventListener("error",()=>{
        const page=img.closest(".book-page")?.dataset.page||"?";
        img.parentElement.innerHTML=`<div class="page-error"><strong>Could not render PDF page ${esc(page)}.</strong><br>The source PDF could not be served by the local content endpoint.</div>`;
      },{once:true});
    });
  }

  async function loadMocks(){
    mocks=await api("/api/mocks");
    $("mockSelect").innerHTML=mocks.map(m=>`<option value="${esc(m.id||m.mock_id||m.name)}">${esc(m.name||m.id||m.mock_id)}</option>`).join("");
    await loadTests();
  }

  async function loadTests(){
    const id=$("mockSelect").value;
    const cfg=await api("/api/mocks/"+encodeURIComponent(id));
    const tests=Object.keys(cfg.tests||{});
    $("testSelect").innerHTML=tests.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
    await loadSection();
  }

  async function loadSection(){
    const mock=$("mockSelect").value, test=$("testSelect").value, section=$("sectionSelect").value;
    if(!mock||!test)return;
    current={mock,test,section};
    try {
      const [content,cfg]=await Promise.all([
        api("/api/mocks/"+encodeURIComponent(mock)+"/tests/"+encodeURIComponent(test)+"/content"),
        api("/api/mocks/"+encodeURIComponent(mock)+"/tests/"+encodeURIComponent(test))
      ]);
      const arr=section==="reading"?(content.reading?.passages||[]):(content.listening?.parts||[]);
      const cfgArr=section==="reading"?(cfg.reading?.passages||[]):(cfg.listening?.parts||[]);
      sectionData=cfgArr.map((c,i)=>({...((arr[i])||{}),pages:c.pages||[],label:section==="reading"?`Passage ${i+1}`:`Part ${i+1}`}));
      index=0;
      render();
    } catch(e) {
      $("bookPane").innerHTML='<div class="review-empty">Could not load this section.</div>';
      $("textPane").innerHTML=`<div class="review-empty">${esc(e.message)}</div>`;
      $("status").textContent="Load failed";
    }
  }

  function render(){
    const s=sectionData[index];
    if(!s){
      $("bookPane").innerHTML='<div class="review-empty">No section configured.</div>';
      $("textPane").innerHTML='<div class="review-empty">No extracted content available.</div>';
      return;
    }

    $("pageLabel").textContent=s.pages?.length?`Pages ${s.pages.join(", ")}`:"";
    $("questionLabel").textContent=s.questions?.length?`${s.questions.length} detected questions`:(s.text?"Text extraction":"0 detected questions");
    $("textTitle").textContent=`${s.label} · ${mode==="structured"?"Formatted text":"Raw extracted text"}`;
    $("status").textContent=`${index+1} / ${sectionData.length}`;
    $("bookPane").innerHTML=renderPages(s.pages);
    wirePageErrors();

    if(mode==="raw"){
      $("textPane").innerHTML=`<pre class="raw-content">${esc(s.text||"")}</pre>`;
      return;
    }

    const qa=s.qa||{};
    const structured=Number.isFinite(qa.expected_count);
    const badge=structured
      ? `<span class="qa-badge ${qa.ok?'':'check'}">${qa.ok?'✓ PASS':'! CHECK'} · ${qa.detected_count||0} / ${qa.expected_count||0} questions</span>`
      : `<span class="qa-badge legacy">Text extraction</span>`;

    let body;
    if(structured){
      body=renderBlocks(s.blocks)+renderQuestions(s.questions)+renderQa(qa);
    } else {
      // Even legacy extraction is rendered as readable paragraphs rather than
      // exposing the raw/monospace extraction output in Formatted mode.
      body=renderLegacy(s.text);
    }

    $("textPane").innerHTML=`<article class="document">
      <div class="document-header">
        <div class="document-kicker">${section==="reading"?"READING PASSAGE":"LISTENING SECTION"} ${index+1}</div>
      </div>
      <div class="document-qa">${badge}</div>
      <div class="document-body">${body}</div>
    </article>`;
  }

  $("mockSelect").addEventListener("change",loadTests);
  $("testSelect").addEventListener("change",loadSection);
  $("sectionSelect").addEventListener("change",loadSection);
  $("prevBtn").addEventListener("click",()=>{if(index>0){index--;render();}});
  $("nextBtn").addEventListener("click",()=>{if(index<sectionData.length-1){index++;render();}});
  $("textMode").addEventListener("click",()=>{mode="structured";$("textMode").classList.add("active");$("rawMode").classList.remove("active");render();});
  $("rawMode").addEventListener("click",()=>{mode="raw";$("rawMode").classList.remove("active");$("textMode").classList.remove("active");render();});
  loadMocks().catch(e=>{$("status").textContent="Load failed";console.error(e);});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTSBand — Content Review</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">
<style>
  :root { --review-bg:#eef0f3; --review-border:#dfe3e8; --review-muted:#68717c; --review-text:#242424; --review-blue:#173b68; }
  * { box-sizing:border-box; } html,body { height:100%; margin:0; } body { background:var(--review-bg); color:var(--review-text); }
  .review-page { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  .review-toolbar { flex:0 0 auto; background:#fff; border-bottom:1px solid var(--review-border); padding:11px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; z-index:10; }
  .review-brand h1 { margin:0; font-family:var(--font-display); font-size:1.15rem; line-height:1.2; } .review-brand p { margin:3px 0 0; color:var(--review-muted); font-size:.75rem; }
  .review-controls { display:flex; align-items:center; gap:7px; flex-wrap:wrap; } .review-controls select,.review-controls button { height:34px; border:1px solid #d5d9e0; border-radius:6px; background:#fff; color:#202124; padding:0 10px; font:inherit; font-size:.8rem; } .review-controls select { min-width:120px; } .review-controls button { cursor:pointer; font-weight:600; } .review-controls button:hover { background:#f7f8fa; } .review-controls button.active { background:var(--review-blue); border-color:var(--review-blue); color:#fff; } .review-controls .nav-btn { min-width:34px; padding:0 9px; } .review-status { display:inline-flex; align-items:center; min-height:28px; padding:0 9px; border-radius:999px; background:#f1f3f5; color:var(--review-muted); font:600 .72rem var(--font-mono); white-space:nowrap; }
  .review-layout { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1px; background:var(--review-border); } .review-pane { min-width:0; min-height:0; display:flex; flex-direction:column; background:#fff; } .pane-head { flex:0 0 auto; min-height:46px; padding:8px 14px; border-bottom:1px solid var(--review-border); display:flex; align-items:center; justify-content:space-between; gap:12px; background:rgba(255,255,255,.98); z-index:5; } .pane-head strong { font-family:var(--font-display); font-size:.84rem; } .pane-meta { color:var(--review-muted); font:.7rem var(--font-mono); } .pane-body { min-height:0; overflow:auto; overscroll-behavior:contain; }
  .book-pane { background:#eef0f3; padding:18px; } .book-page { margin:0 auto 18px; max-width:900px; } .book-page img { display:block; width:100%; height:auto; background:#fff; border:1px solid #d7dbe1; box-shadow:0 2px 8px rgba(16,24,40,.1); } .book-page img.is-loading { min-height:160px; } .page-error { padding:16px; border:1px solid #f0c36d; background:#fff8e8; color:#7a4b00; font-size:.8rem; } .page-error code { font-family:var(--font-mono); font-size:.7rem; }
  .text-pane { background:#fff; } .document { width:min(100%,820px); margin:0 auto; padding:34px 42px 72px; font-family:Georgia,"Times New Roman",serif; color:#202020; font-size:15px; line-height:1.48; } .document-kicker { margin:0 0 7px; color:#555; font:700 .72rem var(--font-mono); letter-spacing:.055em; text-transform:uppercase; } .document-title { margin:0 0 9px; text-align:center; font:700 1.45rem/1.2 Georgia,"Times New Roman",serif; color:#171717; } .document-qa { display:flex; justify-content:flex-end; gap:10px; align-items:center; margin:0 0 22px; padding:6px 0; border-bottom:1px solid #e4e4e4; font:600 .62rem var(--font-mono); color:#777; } .qa-ok { color:#177245; } .qa-check { color:#a15c00; } .qa-legacy { color:#777; } .document-body { min-width:0; } .book-heading { margin:20px 0 10px; font-weight:700; line-height:1.25; } .book-heading.upper { text-transform:uppercase; letter-spacing:.01em; } .book-instruction { margin:0 0 20px; font-style:italic; font-weight:600; line-height:1.35; } .book-title { margin:6px 0 18px; text-align:center; font-size:1.18rem; font-weight:700; line-height:1.25; } .book-paragraph { margin:0 0 15px; text-align:left; } .book-paragraph.section-letter { position:relative; padding-left:29px; } .section-letter .letter { position:absolute; left:0; top:0; font-weight:700; } .question-range { margin:23px 0 14px; padding:8px 0; border-top:1px solid #d9d9d9; border-bottom:1px solid #d9d9d9; font-weight:700; } .question-block { margin:0 0 16px; padding-left:32px; position:relative; } .question-number { position:absolute; left:0; top:1px; font:700 .75rem var(--font-mono); } .question-text { min-width:0; } .question-text p { margin:0 0 8px; } .question-text p:last-child { margin-bottom:0; } .inline-gap { display:inline-block; min-width:70px; margin:0 2px; border-bottom:1px solid #555; vertical-align:baseline; line-height:.9; } .inline-gap-number { font:600 .58rem var(--font-mono); color:#777; margin-right:2px; } .legacy-notice { margin:0 0 20px; padding:6px 0; border-bottom:1px solid #ddd; color:#777; font:600 .62rem var(--font-mono); text-transform:uppercase; letter-spacing:.04em; } .legacy-content { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.48; } .raw-content { margin:0; padding:25px 30px 60px; white-space:pre-wrap; overflow-wrap:anywhere; font:.78rem/1.65 var(--font-mono); } .review-empty { padding:40px 24px; text-align:center; color:var(--review-muted); font-size:.82rem; }
  @media(max-width:1000px) { .review-toolbar { align-items:flex-start; } .review-layout { grid-template-columns:1fr; overflow:auto; } .review-page { height:auto; min-height:100vh; overflow:visible; } .review-pane { min-height:70vh; } .book-pane { max-height:75vh; } } @media(max-width:640px) { .review-toolbar { padding:10px; } .review-controls { width:100%; } .review-controls select { flex:1; min-width:0; } .document { padding:24px 20px 50px; font-size:14px; } .book-pane { padding:10px; } }
</style>
</head>
<body>
<div class="review-page">
  <header class="review-toolbar"><div class="review-brand"><h1>Content Review</h1><p>Original source ↔ structured IELTS content</p></div><div class="review-controls"><select id="mockSelect" aria-label="Mock"><option>Loading mocks…</option></select><select id="testSelect" aria-label="Test"><option>Select test…</option></select><select id="sectionSelect" aria-label="Section"><option value="reading">Reading</option><option value="listening">Listening</option></select><button class="nav-btn" id="prevBtn" title="Previous section">←</button><button class="nav-btn" id="nextBtn" title="Next section">→</button><button id="textMode" class="active">Formatted</button><button id="rawMode">Raw</button><span id="status" class="review-status">Loading…</span></div></header>
  <main class="review-layout"><section class="review-pane"><div class="pane-head"><strong>Original book</strong><span id="pageLabel" class="pane-meta"></span></div><div class="pane-body book-pane" id="bookPane"></div></section><section class="review-pane"><div class="pane-head"><strong id="textTitle">Extracted content</strong><span id="questionLabel" class="pane-meta"></span></div><div class="pane-body text-pane" id="textPane"></div></section></main>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id); let mocks=[],current=null,sectionData=[],index=0,mode="structured";
  async function api(path){const r=await fetch(path,{credentials:"same-origin"});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function formatGaps(v){return esc(v).replace(/\b(\d{1,2})\s*(?:[.…·]{3,}|_{3,})/g,'<span class="inline-gap"><span class="inline-gap-number">$1</span></span>')}
  function isSingleLetter(v){return /^[A-H]$/.test(String(v||"").trim())} function isPassageHeading(v){return /^(reading passage|section|part)\s+\d+/i.test(String(v||"").trim())} function isQuestionRange(v){return /^(questions?|qns?)\s*\d{1,2}\s*(?:and|&|to|[-–—])\s*\d{1,2}\b/i.test(String(v||"").trim())} function isInstruction(v){return /^(you should|complete|choose|write|look at|do the following|answer the questions)/i.test(String(v||"").trim())} function looksUpper(v){const s=String(v||"").trim();return /^[A-Z][A-Z\s'.,\-:()]{4,80}$/.test(s)&&s.length<=80}
  function renderBlocks(blocks){const out=[],arr=blocks||[];for(let i=0;i<arr.length;i++){const raw=String(arr[i]?.text||"").trim();if(!raw)continue;if(isSingleLetter(raw)&&i+1<arr.length){const next=String(arr[i+1]?.text||"").trim();if(next&&!isSingleLetter(next)){out.push(`<p class="book-paragraph section-letter"><span class="letter">${esc(raw)}</span>${formatGaps(next)}</p>`);i++;continue}}if(isPassageHeading(raw))out.push(`<div class="book-heading upper">${formatGaps(raw)}</div>`);else if(isInstruction(raw))out.push(`<p class="book-instruction">${formatGaps(raw)}</p>`);else if(i>0&&isInstruction(String(arr[i-1]?.text||"").trim())&&raw.length<=90)out.push(`<h2 class="book-title">${formatGaps(raw)}</h2>`);else if(looksUpper(raw))out.push(`<div class="book-heading upper">${formatGaps(raw)}</div>`);else out.push(`<p class="book-paragraph">${formatGaps(raw)}</p>`)}return out.join("")}
  function renderQuestions(questions){if(!questions?.length)return"";return `<div class="question-range">Questions</div>`+questions.map(q=>{const body=String(q.text||"").trim();const parts=body.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);return `<div class="question-block"><div class="question-number">${esc(q.question)}</div><div class="question-text">${(parts.length?parts:[body]).map(p=>`<p>${formatGaps(p)}</p>`).join("")}</div></div>`}).join("")}
  function renderLegacy(text){const value=String(text||"").trim();return value?`<div class="legacy-content">${formatGaps(value)}</div>`:'<div class="review-empty">No extracted text available.</div>'}
  function renderPages(pages){if(!pages?.length)return'<div class="review-empty">No page numbers configured.</div>';return pages.map(page=>`<div class="book-page" data-page="${esc(page)}"><img class="is-loading" src="/api/mocks/${encodeURIComponent(current.mock)}/page?page=${encodeURIComponent(page)}" alt="Original PDF page ${esc(page)}" loading="eager"></div>`).join("")}
  function wirePageErrors(){document.querySelectorAll("#bookPane img").forEach(img=>{img.addEventListener("load",()=>img.classList.remove("is-loading"),{once:true});img.addEventListener("error",()=>{const page=img.closest(".book-page")?.dataset.page||"?";img.parentElement.innerHTML=`<div class="page-error"><strong>Could not render PDF page ${esc(page)}.</strong><br>The source PDF could not be served by the local content endpoint.</div>`},{once:true})})}
  async function loadMocks(){mocks=await api("/api/mocks");$("mockSelect").innerHTML=mocks.map(m=>`<option value="${esc(m.id||m.mock_id||m.name)}">${esc(m.name||m.id||m.mock_id)}</option>`).join("");await loadTests()}
  async function loadTests(){const id=$("mockSelect").value,cfg=await api("/api/mocks/"+encodeURIComponent(id));const tests=Object.keys(cfg.tests||{});$("testSelect").innerHTML=tests.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");await loadSection()}
  async function loadSection(){const mock=$("mockSelect").value,test=$("testSelect").value,section=$("sectionSelect").value;if(!mock||!test)return;current={mock,test,section};try{const[content,cfg]=await Promise.all([api("/api/mocks/"+encodeURIComponent(mock)+"/tests/"+encodeURIComponent(test)+"/content"),api("/api/mocks/"+encodeURIComponent(mock)+"/tests/"+encodeURIComponent(test))]);const arr=section==="reading"?(content.reading?.passages||[]):(content.listening?.parts||[]);const cfgArr=section==="reading"?(cfg.reading?.passages||[]):(cfg.listening?.parts||[]);sectionData=cfgArr.map((c,i)=>({...((arr[i])||{}),pages:c.pages||[],label:section==="reading"?`Passage ${i+1}`:`Part ${i+1}`}));index=0;render()}catch(e){$("bookPane").innerHTML='<div class="review-empty">Could not load this section.</div>';$('textPane').innerHTML=`<div class="review-empty">${esc(e.message)}</div>`;$("status").textContent="Load failed"}}
  function render(){const s=sectionData[index];if(!s){$("bookPane").innerHTML='<div class="review-empty">No section configured.</div>';$('textPane').innerHTML='<div class="review-empty">No extracted content available.</div>';return}$("pageLabel").textContent=s.pages?.length?`Pages ${s.pages.join(", ")}`:"";$("questionLabel").textContent=s.questions?.length?`${s.questions.length} detected questions`:(s.text?"Text extraction":"0 detected questions");$("textTitle").textContent=`${s.label} · ${mode==="structured"?"Formatted content":"Raw text"}`;$("status").textContent=`${index+1} / ${sectionData.length}`;$("bookPane").innerHTML=renderPages(s.pages);wirePageErrors();if(mode==="raw"){$("textPane").innerHTML=`<pre class="raw-content">${esc(s.text||"")}</pre>`;return}const qa=s.qa||{},structured=Number.isFinite(qa.expected_count),badge=structured?`<span class="${qa.ok?'qa-ok':'qa-check'}">${qa.ok?'PASS':'CHECK'} · ${qa.detected_count||0}/${qa.expected_count||0}</span>`:`<span class="qa-legacy">Legacy extraction</span>`;let body;if(structured)body=renderBlocks(s.blocks)+renderQuestions(s.questions);else body=`<div class="legacy-notice">Legacy extraction — run scripts/reextract_content.py for structured question metadata</div>`+renderLegacy(s.text);const titleBlock=s.blocks?.find((b,i)=>i>0&&isInstruction(s.blocks[i-1]?.text)&&String(b?.text||"").trim().length<=90);const headerTitle=section==="reading"&&titleBlock?titleBlock.text:"";$("textPane").innerHTML=`<article class="document"><div class="document-kicker">${section==="reading"?"IELTS READING":"IELTS LISTENING"} · ${esc(s.label)}</div>${headerTitle?`<h1 class="document-title">${formatGaps(headerTitle)}</h1>`:""}<div class="document-qa">${badge}${structured&&qa.missing_questions?.length?`<span>Missing: ${esc(qa.missing_questions.join(", "))}</span>`:""}</div><div class="document-body">${body}</div></article>`}
  $("mockSelect").addEventListener("change",loadTests);$("testSelect").addEventListener("change",loadSection);$("sectionSelect").addEventListener("change",loadSection);$("prevBtn").addEventListener("click",()=>{if(index>0){index--;render()}});$("nextBtn").addEventListener("click",()=>{if(index<sectionData.length-1){index++;render()}});$("textMode").addEventListener("click",()=>{mode="structured";$("textMode").classList.add("active");$("rawMode").classList.remove("active");render()});$("rawMode").addEventListener("click",()=>{mode="raw";$("rawMode").classList.remove("active");$("textMode").classList.remove("active");render()});loadMocks().catch(e=>{$("status").textContent="Load failed";console.error(e)})
})();
</script>
</body>
</html>

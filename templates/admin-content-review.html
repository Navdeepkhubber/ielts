<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTSBand — Content Review</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">
<style>
  :root {
    --review-bg: #f6f7f9;
    --review-border: #e5e7eb;
    --review-muted: #667085;
    --review-text: #202124;
    --review-blue: #173b68;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--review-bg); color: var(--review-text); }

  .review-page {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .review-toolbar {
    flex: 0 0 auto;
    background: #fff;
    border-bottom: 1px solid var(--review-border);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    z-index: 10;
  }

  .review-brand { min-width: 180px; }
  .review-brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.15rem;
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  .review-brand p { margin: 3px 0 0; color: var(--review-muted); font-size: .75rem; }

  .review-controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .review-controls select,
  .review-controls button {
    height: 34px;
    border: 1px solid #d5d9e0;
    border-radius: 6px;
    background: #fff;
    color: #202124;
    padding: 0 10px;
    font: inherit;
    font-size: .8rem;
  }
  .review-controls select { min-width: 120px; }
  .review-controls button { cursor: pointer; font-weight: 600; }
  .review-controls button:hover { background: #f7f8fa; }
  .review-controls button.active { background: var(--review-blue); border-color: var(--review-blue); color: #fff; }
  .review-controls .nav-btn { min-width: 34px; padding: 0 9px; }

  .review-status {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 0 9px;
    border-radius: 999px;
    background: #f1f3f5;
    color: var(--review-muted);
    font: 600 .72rem var(--font-mono);
    white-space: nowrap;
  }

  .review-layout {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px;
    background: var(--review-border);
  }

  .review-pane {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
  }

  .pane-head {
    flex: 0 0 auto;
    min-height: 46px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--review-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: rgba(255,255,255,.97);
    z-index: 5;
  }
  .pane-head strong { font-family: var(--font-display); font-size: .84rem; }
  .pane-meta { color: var(--review-muted); font: .7rem var(--font-mono); }

  .pane-body {
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
  }

  /* PDF side */
  .book-pane {
    background: #eef0f3;
    padding: 18px;
  }
  .book-page { margin: 0 auto 18px; max-width: 900px; }
  .book-page:last-child { margin-bottom: 0; }
  .book-page img {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    border: 1px solid #d7dbe1;
    box-shadow: 0 2px 8px rgba(16,24,40,.10);
  }
  .book-page img.is-loading { min-height: 160px; }

  .page-error {
    padding: 16px;
    border: 1px solid #f0c36d;
    background: #fff8e8;
    color: #7a4b00;
    font-size: .8rem;
  }
  .page-error code { font-family: var(--font-mono); font-size: .7rem; }

  /* Document side */
  .text-pane { background: #fff; }
  .document {
    width: min(100%, 820px);
    margin: 0 auto;
    padding: 30px 38px 70px;
    font-family: Georgia, 'Times New Roman', serif;
    color: #242424;
    font-size: 15px;
    line-height: 1.66;
  }

  .document-header {
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 1px solid #dedede;
  }
  .document-kicker {
    margin-bottom: 5px;
    color: #68717c;
    font: 600 .68rem var(--font-mono);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .document-title {
    margin: 0;
    color: #171717;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.55rem;
    line-height: 1.25;
    font-weight: 700;
  }
  .document-subtitle { margin: 8px 0 0; color: #60656b; font-size: .82rem; }

  .qa-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
    padding: 8px 10px;
    background: #fafafa;
    border: 1px solid #e7e7e7;
    border-radius: 5px;
    font-family: var(--font-mono);
  }
  .qa-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: .68rem;
    font-weight: 800;
    letter-spacing: .02em;
  }
  .qa-ok { color: #177245; }
  .qa-check { color: #a15c00; }
  .qa-legacy { color: #667085; }
  .qa-detail { color: #7b8087; font-size: .66rem; text-align: right; }

  .document-body { min-width: 0; }
  .prose-block { margin: 0 0 15px; }
  .prose-heading {
    margin: 26px 0 10px;
    color: #191919;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.02rem;
    line-height: 1.35;
    font-weight: 700;
  }
  .prose-heading:first-child { margin-top: 0; }

  .instruction {
    margin: 18px 0 12px;
    font-weight: 700;
  }
  .question-range {
    margin: 22px 0 13px;
    padding: 9px 0;
    border-top: 1px solid #dedede;
    border-bottom: 1px solid #dedede;
    font-weight: 700;
  }

  .question-block {
    position: relative;
    margin: 0 0 16px;
    padding-left: 34px;
  }
  .question-number {
    position: absolute;
    left: 0;
    top: 1px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #c7cbd1;
    border-radius: 3px;
    color: #333;
    background: #fafafa;
    font: 700 .67rem var(--font-mono);
  }
  .question-text { min-width: 0; }
  .question-text p { margin: 0 0 7px; }
  .question-text p:last-child { margin-bottom: 0; }

  .inline-gap {
    display: inline-block;
    min-width: 88px;
    margin: 0 3px;
    border-bottom: 1px solid #555;
    vertical-align: baseline;
    line-height: .95;
  }
  .inline-gap-number { color: #666; font: 600 .62rem var(--font-mono); margin-right: 3px; }

  .legacy-content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.7;
  }
  .raw-content {
    margin: 0;
    padding: 22px 28px 50px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: .78rem/1.65 var(--font-mono);
  }

  .review-empty { padding: 40px 24px; text-align: center; color: var(--review-muted); font-size: .82rem; }
  .review-note { display: none; }

  @media (max-width: 1000px) {
    .review-toolbar { align-items: flex-start; }
    .review-layout { grid-template-columns: 1fr; overflow: auto; }
    .review-page { height: auto; min-height: 100vh; overflow: visible; }
    .review-pane { min-height: 70vh; }
    .pane-body { max-height: none; }
    .book-pane { max-height: 75vh; }
    .text-pane { max-height: none; }
  }

  @media (max-width: 640px) {
    .review-toolbar { padding: 10px; }
    .review-controls { width: 100%; }
    .review-controls select { flex: 1; min-width: 0; }
    .document { padding: 22px 20px 50px; font-size: 14px; }
    .book-pane { padding: 10px; }
  }
</style>
</head>
<body>
<div class="review-page">
  <header class="review-toolbar">
    <div class="review-brand">
      <h1>Content Review</h1>
      <p>Original source ↔ structured IELTS content</p>
    </div>

    <div class="review-controls">
      <select id="mockSelect" aria-label="Mock"><option>Loading mocks…</option></select>
      <select id="testSelect" aria-label="Test"><option>Select test…</option></select>
      <select id="sectionSelect" aria-label="Section">
        <option value="reading">Reading</option>
        <option value="listening">Listening</option>
      </select>
      <button class="nav-btn" id="prevBtn" title="Previous section">←</button>
      <button class="nav-btn" id="nextBtn" title="Next section">→</button>
      <button id="textMode" class="active">Formatted</button>
      <button id="rawMode">Raw</button>
      <span id="status" class="review-status">Loading…</span>
    </div>
  </header>

  <main class="review-layout">
    <section class="review-pane">
      <div class="pane-head">
        <strong>Original book</strong>
        <span id="pageLabel" class="pane-meta"></span>
      </div>
      <div class="pane-body book-pane" id="bookPane"></div>
    </section>

    <section class="review-pane">
      <div class="pane-head">
        <strong id="textTitle">Extracted content</strong>
        <span id="questionLabel" class="pane-meta"></span>
      </div>
      <div class="pane-body text-pane" id="textPane"></div>
    </section>
  </main>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let mocks = [];
  let current = null;
  let sectionData = [];
  let index = 0;
  let mode = 'structured';

  async function api(path) {
    const r = await fetch(path, { credentials: 'same-origin' });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function isHeading(text) {
    const value = String(text || '').trim();
    if (!value) return false;
    return /^(reading passage|section|part|questions?)\b/i.test(value) ||
      /^(complete|choose|write|look at|do the following|answer the questions)\b/i.test(value) ||
      (/^[A-Z][A-Z\s'.,\-:()]{4,80}$/.test(value) && value.length <= 80);
  }

  function isInstruction(text) {
    return /^(complete|choose|write|look at|do the following|answer the questions)\b/i.test(String(text || '').trim());
  }

  function isQuestionRange(text) {
    return /^(questions?|qns?)\s*\d{1,2}\s*(and|&|to|[-–—])\s*\d{1,2}\b/i.test(String(text || '').trim());
  }

  function formatGaps(text) {
    let safe = esc(text);
    return safe.replace(/\b(\d{1,2})\s*(?:[.…·]{3,}|_{3,})/g,
      '<span class="inline-gap"><span class="inline-gap-number">$1</span></span>');
  }

  function renderBlock(text) {
    const value = String(text || '').trim();
    if (!value) return '';
    if (isQuestionRange(value)) return `<div class="question-range">${formatGaps(value)}</div>`;
    if (isInstruction(value)) return `<p class="instruction">${formatGaps(value)}</p>`;
    if (isHeading(value)) return `<div class="prose-block prose-heading">${formatGaps(value)}</div>`;
    return `<p class="prose-block">${formatGaps(value)}</p>`;
  }

  function renderProse(blocks) {
    return (blocks || []).map(b => renderBlock(b?.text)).filter(Boolean).join('');
  }

  function renderQuestionText(text) {
    const parts = String(text || '').trim().split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
    if (!parts.length) return '';
    return parts.map(p => `<p>${formatGaps(p)}</p>`).join('');
  }

  function renderQuestions(questions) {
    if (!questions?.length) return '';
    return `
      <div class="question-range">Questions</div>
      ${questions.map(q => `
        <div class="question-block">
          <div class="question-number">${esc(q.question)}</div>
          <div class="question-text">${renderQuestionText(q.text)}</div>
        </div>
      `).join('')}
    `;
  }

  function renderLegacyText(text) {
    const value = String(text || '').trim();
    return value
      ? `<div class="legacy-content">${esc(value)}</div>`
      : '<div class="review-empty">No extracted text available.</div>';
  }

  function renderPages(pages) {
    if (!pages?.length) return '<div class="review-empty">No page numbers configured.</div>';
    return pages.map(page => `
      <div class="book-page" data-page="${esc(page)}">
        <img class="is-loading" src="/api/mocks/${encodeURIComponent(current.mock)}/page?page=${encodeURIComponent(page)}" alt="Original PDF page ${esc(page)}" loading="eager">
      </div>
    `).join('');
  }

  function wirePageErrors() {
    document.querySelectorAll('#bookPane img').forEach(img => {
      img.addEventListener('load', () => img.classList.remove('is-loading'), { once: true });
      img.addEventListener('error', () => {
        const page = img.closest('.book-page')?.dataset.page || '?';
        const holder = img.parentElement;
        holder.innerHTML = `<div class="page-error"><strong>Could not render PDF page ${esc(page)}.</strong><br>Check the source PDF/content endpoint.<br><code>/api/mocks/${esc(current.mock)}/page?page=${esc(page)}</code></div>`;
      }, { once: true });
    });
  }

  async function loadMocks() {
    mocks = await api('/api/mocks');
    $('mockSelect').innerHTML = mocks.map(m =>
      `<option value="${esc(m.id || m.mock_id || m.name)}">${esc(m.name || m.id || m.mock_id)}</option>`
    ).join('');
    await loadTests();
  }

  async function loadTests() {
    const id = $('mockSelect').value;
    if (!id) return;
    const cfg = await api('/api/mocks/' + encodeURIComponent(id));
    const tests = Object.keys(cfg.tests || {});
    $('testSelect').innerHTML = tests.length
      ? tests.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('')
      : '<option value="">No tests</option>';
    await loadSection();
  }

  async function loadSection() {
    const mock = $('mockSelect').value;
    const test = $('testSelect').value;
    const section = $('sectionSelect').value;
    if (!mock || !test) return;

    current = { mock, test, section };
    $('status').textContent = 'Loading…';

    try {
      const [content, cfg] = await Promise.all([
        api('/api/mocks/' + encodeURIComponent(mock) + '/tests/' + encodeURIComponent(test) + '/content'),
        api('/api/mocks/' + encodeURIComponent(mock) + '/tests/' + encodeURIComponent(test))
      ]);

      const arr = section === 'reading'
        ? (content.reading?.passages || [])
        : (content.listening?.parts || []);
      const cfgArr = section === 'reading'
        ? (cfg.reading?.passages || [])
        : (cfg.listening?.parts || []);

      sectionData = cfgArr.map((cfgSection, i) => ({
        ...(arr[i] || {}),
        pages: cfgSection.pages || [],
        label: section === 'reading' ? `Passage ${i + 1}` : `Part ${i + 1}`
      }));
      index = 0;
      render();
    } catch (e) {
      $('bookPane').innerHTML = '<div class="review-empty">Could not load this section.</div>';
      $('textPane').innerHTML = `<div class="review-empty">${esc(e.message)}</div>`;
      $('status').textContent = 'Load failed';
    }
  }

  function renderQa(s) {
    const qa = s.qa || {};
    const structured = Number.isFinite(qa.expected_count) && qa.expected_count > 0;
    if (!structured) {
      return `<div class="qa-row"><span class="qa-badge qa-legacy">LEGACY EXTRACTION</span><span class="qa-detail">No structured QA metadata for this section</span></div>`;
    }

    const ok = Boolean(qa.ok);
    const badge = `<span class="qa-badge ${ok ? 'qa-ok' : 'qa-check'}">${ok ? '✓ PASS' : '⚠ CHECK'} · ${qa.detected_count || 0}/${qa.expected_count || 0} QUESTIONS</span>`;
    const details = [
      (qa.missing_questions || []).length ? `Missing ${qa.missing_questions.join(', ')}` : '',
      (qa.duplicate_questions || []).length ? `Duplicate ${qa.duplicate_questions.join(', ')}` : '',
      (qa.unexpected_questions || []).length ? `Unexpected ${qa.unexpected_questions.join(', ')}` : ''
    ].filter(Boolean).join(' · ');
    return `<div class="qa-row">${badge}<span class="qa-detail">${esc(details || 'Question range matches manifest')}</span></div>`;
  }

  function render() {
    const s = sectionData[index];
    if (!s) {
      $('bookPane').innerHTML = '<div class="review-empty">No section configured.</div>';
      $('textPane').innerHTML = '<div class="review-empty">No structured content available.</div>';
      $('status').textContent = '0 / 0';
      return;
    }

    $('pageLabel').textContent = s.pages?.length ? `Pages ${s.pages.join(', ')}` : '';
    $('questionLabel').textContent = s.questions?.length
      ? `${s.questions.length} detected`
      : (s.text ? 'legacy text' : 'no questions');
    $('textTitle').textContent = `${s.label} · ${mode === 'structured' ? 'Formatted content' : 'Raw extraction'}`;
    $('status').textContent = `${index + 1} / ${sectionData.length}`;

    $('bookPane').innerHTML = renderPages(s.pages);
    wirePageErrors();

    if (mode === 'raw') {
      $('textPane').innerHTML = `<pre class="raw-content">${esc(s.text || '')}</pre>`;
      return;
    }

    const title = s.title || s.heading || '';
    const header = `
      <div class="document-header">
        <div class="document-kicker">IELTS ${current.section === 'reading' ? 'Reading' : 'Listening'} · ${esc(s.label)}</div>
        ${title ? `<h2 class="document-title">${esc(title)}</h2>` : `<h2 class="document-title">${esc(s.label)}</h2>`}
        <p class="document-subtitle">Structured text view for content verification</p>
      </div>
    `;

    const prose = renderProse(s.blocks);
    const questions = renderQuestions(s.questions);
    const body = prose + questions || renderLegacyText(s.text);

    $('textPane').innerHTML = `<article class="document">${header}${renderQa(s)}<div class="document-body">${body}</div></article>`;
  }

  $('mockSelect').addEventListener('change', loadTests);
  $('testSelect').addEventListener('change', loadSection);
  $('sectionSelect').addEventListener('change', loadSection);
  $('prevBtn').addEventListener('click', () => {
    if (index > 0) { index--; render(); }
  });
  $('nextBtn').addEventListener('click', () => {
    if (index < sectionData.length - 1) { index++; render(); }
  });
  $('textMode').addEventListener('click', () => {
    mode = 'structured';
    $('textMode').classList.add('active');
    $('rawMode').classList.remove('active');
    render();
  });
  $('rawMode').addEventListener('click', () => {
    mode = 'raw';
    $('rawMode').classList.add('active');
    $('textMode').classList.remove('active');
    render();
  });

  loadMocks().catch(e => {
    $('status').textContent = 'Load failed';
    $('bookPane').innerHTML = '<div class="review-empty">Could not load mocks.</div>';
    $('textPane').innerHTML = `<div class="review-empty">${esc(e.message)}</div>`;
  });
})();
</script>
</body>
</html>

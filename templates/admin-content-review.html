<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTSBand — Content Review</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">

<style>
:root{
  --bg:#eef0f3;
  --line:#dfe4ea;
  --ink:#172033;
  --muted:#667085;
  --blue:#173b68;
  --blueSoft:#eef6ff;
  --green:#16804f;
  --greenSoft:#effaf4;
  --greenLine:#ccebd9
}

*{box-sizing:border-box}

html,body{
  height:100%;
  margin:0
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.review{
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden
}

.toolbar{
  height:68px;
  flex:none;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  gap:16px
}

.brand h1{
  margin:0;
  font-size:20px;
  line-height:1.1;
  font-weight:800
}

.brand p{
  margin:4px 0 0;
  font-size:12px;
  color:var(--muted)
}

.controls{
  display:flex;
  align-items:center;
  gap:7px
}

.controls select,
.controls button{
  height:35px;
  border:1px solid #d5d9e0;
  border-radius:7px;
  background:#fff;
  color:#202124;
  padding:0 11px;
  font:inherit;
  font-size:13px
}

.controls select{
  min-width:115px
}

.controls button{
  font-weight:650;
  cursor:pointer
}

.controls button.active{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff
}

.nav{
  min-width:36px!important;
  padding:0 9px!important
}

.counter{
  font-size:12px;
  color:var(--muted);
  font-weight:650;
  padding-left:5px
}

.layout{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:var(--line)
}

.pane{
  min-width:0;
  min-height:0;
  background:#fff;
  display:flex;
  flex-direction:column
}

.paneHead{
  height:45px;
  flex:none;
  border-bottom:1px solid var(--line);
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.paneHead strong{
  font-size:14px
}

.paneMeta{
  font-size:11px;
  color:#7b8798;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace
}

.bookBody{
  min-height:0;
  overflow:auto;
  background:#eef0f3;
  padding:18px
}

.bookPage{
  max-width:900px;
  margin:0 auto 18px
}

.bookPage img{
  display:block;
  width:100%;
  height:auto;
  background:#fff;
  border:1px solid #d7dbe1;
  box-shadow:0 2px 8px rgba(16,24,40,.09)
}

.pageError{
  padding:16px;
  border:1px solid #f0c36d;
  background:#fff8e8;
  color:#7a4b00;
  font-size:13px
}

.textBody{
  min-height:0;
  overflow:auto;
  background:#fff
}

.doc{
  width:min(100%,780px);
  margin:0 auto;
  padding:30px 34px 70px;
  font-family:Georgia,"Times New Roman",serif;
  color:#222
}

.docTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  padding-bottom:20px;
  border-bottom:1px solid #e5e7eb;
  margin-bottom:25px
}

.kicker{
  font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:1.4px;
  color:#697586;
  text-transform:uppercase
}

.docTitle{
  margin:7px 0 0;
  font-size:28px;
  line-height:1.12;
  font-weight:800;
  color:#171717
}

.qa{
  font:700 11px/1 Arial,sans-serif;
  padding:7px 11px;
  border-radius:999px;
  background:#ecfbf2;
  color:var(--green);
  border:1px solid var(--greenLine);
  white-space:nowrap
}

.qa.check{
  background:#fff8e8;
  color:#9a5a00;
  border-color:#f0d39c
}

.heading{
  margin:26px 0 11px;
  font-size:18px;
  line-height:1.25;
  font-weight:800;
  color:#171717
}

.subheading{
  margin:22px 0 9px;
  font-size:14px;
  line-height:1.3;
  font-weight:800;
  color:#252525
}

.instruction{
  margin:0 0 20px;
  padding:13px 15px;
  border:1px solid #cfe2ff;
  border-radius:8px;
  background:var(--blueSoft);
  font:14px/1.55 Inter,system-ui,sans-serif;
  color:#18345b
}

.paragraph{
  margin:0 0 17px;
  font-size:16px;
  line-height:1.72;
  color:#30343a
}

.questionGroup{
  margin:27px 0 24px;
  border:1px solid var(--greenLine);
  border-radius:9px;
  overflow:hidden;
  background:#fff;
  font-family:Inter,system-ui,sans-serif
}

.questionHead{
  padding:13px 16px;
  background:var(--greenSoft);
  border-bottom:1px solid var(--greenLine);
  display:flex;
  align-items:center;
  justify-content:space-between
}

.questionHead h3{
  margin:0;
  font-size:15px;
  color:var(--green);
  font-weight:800
}

.questionHead span{
  font-size:11px;
  color:#6b7280
}

.qrow{
  display:grid;
  grid-template-columns:30px minmax(0,1fr) 52px;
  gap:12px;
  padding:13px 14px;
  border-top:1px solid #edf0f2;
  align-items:start
}

.qrow:first-of-type{
  border-top:0
}

.qnum{
  width:28px;
  height:28px;
  border-radius:6px;
  background:var(--blue);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800
}

.qtext{
  font-size:13.5px;
  line-height:1.55;
  color:#263445;
  padding-top:3px
}

.answer{
  height:29px;
  border:1px dashed #c7d0d9;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8a96a3;
  font-size:10px;
  font-weight:700
}

.blank{
  display:inline-block;
  min-width:82px;
  border-bottom:1px solid #737b86;
  height:.9em;
  vertical-align:baseline;
  margin:0 3px
}

.qaSummary{
  margin-top:30px;
  padding:14px 16px;
  border:1px solid #d7e8fb;
  border-radius:9px;
  background:#eef6ff;
  font:13px/1.5 Inter,system-ui,sans-serif
}

.qaSummary strong{
  font-weight:800
}

.qaStats{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:5px;
  color:#34495e
}

.raw{
  margin:0;
  padding:25px 30px 60px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace
}

.empty{
  padding:50px 25px;
  text-align:center;
  color:var(--muted);
  font-size:13px
}

.note{
  margin-top:12px;
  padding:9px 12px;
  border:1px solid #ead6a9;
  border-radius:7px;
  background:#fff9e9;
  color:#8a5a00;
  font:11px/1.4 Inter,system-ui,sans-serif
}

@media(max-width:1000px){
  .layout{
    grid-template-columns:1fr
  }

  .review{
    height:auto;
    min-height:100vh;
    overflow:visible
  }

  .pane{
    min-height:70vh
  }
}

@media(max-width:650px){
  .toolbar{
    height:auto;
    align-items:flex-start;
    flex-direction:column
  }

  .controls{
    width:100%;
    flex-wrap:wrap
  }

  .doc{
    padding:22px 17px 50px
  }

  .qrow{
    grid-template-columns:28px minmax(0,1fr)
  }

  .answer{
    display:none
  }
}
</style>
</head>

<body>

<div class="review">

<header class="toolbar">

  <div class="brand">
    <h1>Content Review</h1>
    <p>Original source ↔ structured IELTS content</p>
  </div>

  <div class="controls">

    <select id="mock">
      <option value="">Loading mocks…</option>
    </select>

    <select id="test">
      <option value="">Select test…</option>
    </select>

    <select id="section">
      <option value="reading">Reading</option>
      <option value="listening">Listening</option>
    </select>

    <button id="prev" class="nav" type="button">←</button>
    <button id="next" class="nav" type="button">→</button>

    <button id="formatted" class="active" type="button">
      Formatted
    </button>

    <button id="raw" type="button">
      Raw
    </button>

    <span id="counter" class="counter">—</span>

  </div>

</header>

<main class="layout">

  <section class="pane">

    <div class="paneHead">
      <strong>Original book</strong>
      <span id="pages" class="paneMeta"></span>
    </div>

    <div id="book" class="bookBody"></div>

  </section>

  <section class="pane">

    <div class="paneHead">
      <strong id="title">Formatted content</strong>
      <span id="qcount" class="paneMeta"></span>
    </div>

    <div id="text" class="textBody"></div>

  </section>

</main>

</div>

<script>
(() => {

  const $ = id => document.getElementById(id);

  let data = [];
  let idx = 0;
  let mode = 'formatted';
  let current = null;
  let bust = Date.now();

  const esc = value =>
    String(value ?? '').replace(
      /[&<>"']/g,
      char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char])
    );

  const range = r => {

    const a = Number(r?.[0]);
    const b = Number(r?.[1]);

    if (
      Number.isInteger(a) &&
      Number.isInteger(b) &&
      a <= b
    ) {
      return Array.from(
        { length: b - a + 1 },
        (_, i) => a + i
      );
    }

    return [];
  };

  const blank = s =>
    esc(s)
      .replace(
        /\b\d{1,2}\s*(?:[.…·]{2,}|_{2,})/g,
        '<span class="blank"></span>'
      )
      .replace(
        /_{3,}/g,
        '<span class="blank"></span>'
      );

  async function api(path) {

    const response = await fetch(path, {
      credentials: 'same-origin',
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error(
        `${response.status} ${response.statusText}`
      );
    }

    return response.json();
  }

  function isInstruction(s) {
    return /^(you should|complete|choose|write|look at|answer the questions|the following)/i
      .test(s);
  }

  function isPassage(s) {
    return /^(reading passage|listening section|section|part)\s*\d*/i
      .test(s);
  }

  function isHeading(s) {
    return /^[A-Z][A-Z\s'.,:;()\-&\-]{4,80}$/.test(s)
      && s.length < 90;
  }

  function qa(qs, r) {

    const expected = range(r);
    const seen = new Set();
    const dupes = [];

    qs.forEach(q => {

      const n = Number(q.question);

      if (seen.has(n)) {
        dupes.push(n);
      }

      seen.add(n);
    });

    const detected =
      qs.map(q => Number(q.question));

    const missing =
      expected.filter(n => !seen.has(n));

    const unexpected =
      detected.filter(
        n => !expected.includes(n)
      );

    return {
      e: expected,
      d: detected,
      missing,
      unexpected,
      dupes,
      ok:
        expected.length &&
        detected.length === expected.length &&
        !missing.length &&
        !unexpected.length &&
        !dupes.length &&
        detected.every(
          (n, i) => n === expected[i]
        )
    };
  }

  function repairQuestions(raw, r) {

    const expected = range(r);

    if (!expected.length || !raw?.length) {
      return {
        qs: raw || [],
        repaired: false
      };
    }

    const groups = new Map();

    raw.forEach(q => {

      const key = String(q.text || '')
        .replace(/\s+/g, ' ')
        .trim();

      if (!groups.has(key)) {
        groups.set(key, []);
      }

      groups.get(key).push(q);
    });

    const out = [];
    let repaired = false;

    for (const [text, members] of groups) {

      if (members.length < 2) {
        out.push(...members);
        continue;
      }

      const header = text.match(
        /(?:questions?|qns?)\s+(\d{1,2})\s*(?:to|[-–—]|and|&)\s*(\d{1,2})/i
      );

      if (!header) {
        out.push(...members);
        continue;
      }

      const start = +header[1];
      const end = +header[2];

      const wanted = expected.filter(
        n => n >= start && n <= end
      );

      const body = text
        .replace(
          /^.*?(?:questions?|qns?)\s+\d{1,2}\s*(?:to|[-–—]|and|&)\s*\d{1,2}\b/i,
          ''
        )
        .trim();

      const positions = [];
      let cursor = 0;

      for (const n of wanted) {

        const re = new RegExp('\\b' + n + '\\b');

        const match =
          re.exec(body.slice(cursor));

        if (!match) {
          positions.length = 0;
          break;
        }

        positions.push({
          n,
          start: cursor + match.index,
          end:
            cursor +
            match.index +
            match[0].length
        });

        cursor =
          cursor +
          match.index +
          match[0].length;
      }

      if (positions.length >= 2) {

        positions.forEach((position, i) => {

          const endPos =
            positions[i + 1]?.start ??
            body.length;

          const textPart = body
            .slice(position.end, endPos)
            .replace(
              /^[\s.·…_)*–—:]+/,
              ''
            )
            .replace(/\s+/g, ' ')
            .trim();

          if (textPart) {

            out.push({
              question: position.n,
              text: textPart,
              page: members[0].page
            });

          }

        });

        repaired = true;

      } else {
        out.push(...members);
      }
    }

    out.sort(
      (a, b) =>
        Number(a.question) -
        Number(b.question)
    );

    return {
      qs: out,
      repaired
    };
  }

  function renderBlocks(blocks) {

    return (blocks || [])
      .map(block => {

        const s =
          String(block?.text || '').trim();

        if (!s) {
          return '';
        }

        if (isPassage(s)) {
          return `
            <div class="heading">
              ${blank(s)}
            </div>
          `;
        }

        if (isInstruction(s)) {
          return `
            <div class="instruction">
              ${blank(s)}
            </div>
          `;
        }

        if (isHeading(s)) {
          return `
            <div class="subheading">
              ${blank(s)}
            </div>
          `;
        }

        return `
          <p class="paragraph">
            ${blank(s)}
          </p>
        `;

      })
      .join('');
  }

  function renderQuestions(qs) {

    if (!qs.length) {
      return '';
    }

    const a = qs[0].question;
    const b = qs[qs.length - 1].question;

    return `
      <section class="questionGroup">

        <div class="questionHead">
          <h3>
            Questions ${esc(a)}–${esc(b)}
          </h3>

          <span>
            ${qs.length} questions
          </span>
        </div>

        ${qs.map(q => `
          <div class="qrow">

            <div class="qnum">
              ${esc(q.question)}
            </div>

            <div class="qtext">
              ${blank(q.text)}
            </div>

            <div class="answer">
              Answer
            </div>

          </div>
        `).join('')}

      </section>
    `;
  }

  function renderQA(q, repaired) {

    return `
      <div class="qaSummary">

        <strong>
          ${q.ok
            ? '✓ QA passed'
            : '! QA needs review'}
        </strong>

        <div class="qaStats">

          <span>
            Detected:
            <strong>${q.d.length}</strong>
          </span>

          <span>
            Expected:
            <strong>${q.e.length}</strong>
          </span>

          <span>
            Missing:
            <strong>${q.missing.length}</strong>
          </span>

          <span>
            Duplicates:
            <strong>${q.dupes.length}</strong>
          </span>

          <span>
            Unexpected:
            <strong>${q.unexpected.length}</strong>
          </span>

        </div>

        ${
          repaired
            ? `
              <div class="note">
                Grouped question text was repaired for display.
                The source content JSON should still be regenerated
                so the corrected boundaries are persisted.
              </div>
            `
            : ''
        }

      </div>
    `;
  }

  function renderBook(pages) {

    if (!pages?.length) {
      return `
        <div class="empty">
          No source pages configured.
        </div>
      `;
    }

    return pages
      .map(page => `
        <div class="bookPage">

          <img
            src="/api/mocks/${encodeURIComponent(current.mock)}/page?page=${encodeURIComponent(page)}&v=${bust}"
            data-page="${esc(page)}"
            alt="Original PDF page ${esc(page)}"
          >

        </div>
      `)
      .join('');
  }

  function wireBook() {

    const book = $('#book');

    if (!book) {
      return;
    }

    book
      .querySelectorAll('img')
      .forEach(img => {

        img.onerror = () => {

          const page =
            img.dataset.page;

          img.parentElement.innerHTML = `
            <div class="pageError">

              <strong>
                Could not render PDF page ${esc(page)}.
              </strong>

              <br><br>

              Check the local mock PDF
              and PDF-render endpoint.

            </div>
          `;
        };

      });
  }

  function render() {

    const book = $('#book');
    const text = $('#text');
    const pages = $('#pages');
    const counter = $('#counter');
    const title = $('#title');
    const qcount = $('#qcount');

    if (!book || !text) {
      console.error(
        'Content Review: required render elements are missing.'
      );
      return;
    }

    const section = data[idx];

    if (!section) {

      book.innerHTML = `
        <div class="empty">
          No section configured.
        </div>
      `;

      text.innerHTML = `
        <div class="empty">
          No content available.
        </div>
      `;

      if (pages) {
        pages.textContent = '';
      }

      if (counter) {
        counter.textContent = '—';
      }

      return;
    }

    if (pages) {
      pages.textContent =
        section.pages?.length
          ? `Pages ${section.pages.join(', ')}`
          : '';
    }

    if (counter) {
      counter.textContent =
        `${idx + 1} / ${data.length}`;
    }

    book.innerHTML =
      renderBook(section.pages);

    wireBook();

    if (mode === 'raw') {

      if (title) {
        title.textContent =
          `${section.label} · Raw extracted text`;
      }

      if (qcount) {
        qcount.textContent =
          'Text extraction';
      }

      text.innerHTML = `
        <pre class="raw">${esc(
          section.text || ''
        )}</pre>
      `;

      return;
    }

    const repairedResult =
      repairQuestions(
        section.questions || [],
        section.question_range
      );

    const qs =
      repairedResult.qs;

    const quality =
      qa(
        qs,
        section.question_range
      );

    if (title) {
      title.textContent =
        `${section.label} · Formatted content`;
    }

    if (qcount) {
      qcount.textContent =
        qs.length
          ? `${qs.length} detected questions`
          : '';
    }

    const badge =
      quality.e.length
        ? `
          <span class="qa ${quality.ok ? '' : 'check'}">
            ${
              quality.ok
                ? '✓ PASS'
                : '! CHECK'
            }
            · ${quality.d.length} / ${quality.e.length}
          </span>
        `
        : '';

    let body =
      renderBlocks(section.blocks);

    if (
      !body &&
      section.text &&
      !qs.length
    ) {
      body = `
        <p class="paragraph">
          ${blank(section.text)}
        </p>
      `;
    }

    text.innerHTML = `
      <article class="doc">

        <div class="docTop">

          <div>

            <div class="kicker">
              IELTS
              ${esc(current.section.toUpperCase())}
              ·
              ${esc(section.label)}
            </div>

            <div class="docTitle">
              ${esc(section.label)}
            </div>

          </div>

          ${badge}

        </div>

        ${body}

        ${renderQuestions(qs)}

        ${
          quality.e.length
            ? renderQA(
                quality,
                repairedResult.repaired
              )
            : ''
        }

      </article>
    `;
  }

  async function load() {

    /*
     * Fetch first. The admin shell can replace the content-review DOM
     * between script execution and the async response, so the selector
     * must be resolved immediately before it is used.
     */
    const mocks =
      await api('/api/mocks');

    const mockSelect = document.getElementById('mock');

    if (!mockSelect) {
      /*
       * Not an application error. The MutationObserver will retry once
       * the current content-review markup exists.
       */
      return false;
    }

    if (!Array.isArray(mocks)) {
      throw new Error(
        'Invalid response from /api/mocks.'
      );
    }

    mockSelect.innerHTML =
      mocks
        .map(mock => {

          const id =
            mock.id ??
            mock.mock_id ??
            mock.name;

          const name =
            mock.name ??
            mock.id ??
            mock.mock_id;

          return `
            <option value="${esc(id)}">
              ${esc(name)}
            </option>
          `;
        })
        .join('');

    await tests();
    return true;
  }

  async function tests() {

    const mockSelect = $('#mock');
    const testSelect = $('#test');

    if (!mockSelect || !testSelect) {
      return false;
    }

    const mock =
      mockSelect.value;

    if (!mock) {

      testSelect.innerHTML = `
        <option value="">
          Select test…
        </option>
      `;

      return;
    }

    const config =
      await api(
        '/api/mocks/' +
        encodeURIComponent(mock)
      );

    const tests =
      Object.keys(
        config.tests || {}
      );

    testSelect.innerHTML =
      tests
        .map(test => `
          <option value="${esc(test)}">
            ${esc(test)}
          </option>
        `)
        .join('');

    await section();
  }

  async function section() {

    /*
     * Resolve the controls at the last possible moment. The admin shell
     * can replace the toolbar between a change event and this async
     * handler, so never keep stale element references.
     */
    const mockSelect = document.getElementById('mock');
    const testSelect = document.getElementById('test');
    const sectionSelect = document.getElementById('section');

    /*
     * A missing selector is a transient DOM state, not an application
     * error. The delegated event handler / MutationObserver will allow
     * the next interaction to retry.
     */
    if (!mockSelect || !testSelect || !sectionSelect) {
      return false;
    }

    const mock = mockSelect.value;
    const test = testSelect.value;
    const sec = sectionSelect.value || 'reading';

    if (!mock || !test) {
      return false;
    }

    current = {
      mock,
      test,
      section: sec
    };

    bust = Date.now();

    /*
     * LOCAL CONTENT ONLY.
     */
    const [
      content,
      config
    ] = await Promise.all([

      api(
        '/api/mocks/' +
        encodeURIComponent(mock) +
        '/tests/' +
        encodeURIComponent(test) +
        '/content'
      ),

      api(
        '/api/mocks/' +
        encodeURIComponent(mock) +
        '/tests/' +
        encodeURIComponent(test)
      )

    ]);

    const extracted =
      sec === 'reading'
        ? (content.reading?.passages || [])
        : (content.listening?.parts || []);

    const configured =
      sec === 'reading'
        ? (config.reading?.passages || [])
        : (config.listening?.parts || []);

    data = configured.map((item, i) => ({
      ...(extracted[i] || {}),
      pages: item.pages || [],
      label:
        sec === 'reading'
          ? `Passage ${i + 1}`
          : `Part ${i + 1}`,
      question_range: item.questions || null
    }));

    idx = 0;
    render();

    return true;
  }
  /*
   * Do NOT bind directly to #mock/#test/etc.
   *
   * The Flask admin page can be inserted/re-rendered dynamically. Direct
   * bindings were the source of:
   *
   *   Cannot set properties of null (setting 'onchange')
   *
   * Event delegation keeps the controls working regardless of when they
   * enter the DOM.
   */

  let initialized = false;
  let loading = false;

  async function initializeContentReview() {
    if (initialized || loading) return;

    if (!document.getElementById('mock')) {
      return;
    }

    loading = true;

    try {
      const success = await load();

      /*
       * Only consider the page initialized after load actually found
       * the current DOM and populated it. If the admin shell replaced
       * the markup during the async request, leave this false so the
       * observer can retry against the new DOM.
       */
      if (success) {
        initialized = true;
      }
    } catch (e) {
      console.error('Content Review: failed to load:', e);

      const text = document.getElementById('text');

      if (text) {
        text.innerHTML =
          `<div class="empty">Could not load content: ${esc(e.message)}</div>`;
      }
    } finally {
      loading = false;
    }
  }

  function bindEvents() {
    if (document.__contentReviewEventsBound) {
      return true;
    }

    document.__contentReviewEventsBound = true;

    /*
     * CHANGE EVENTS
     */
    document.addEventListener('change', event => {
      const target = event.target;

      if (!(target instanceof HTMLElement)) {
        return;
      }

      if (target.id === 'mock') {
        tests().catch(handleLoadError);
        return;
      }

      if (target.id === 'test' || target.id === 'section') {
        section().catch(handleLoadError);
      }
    });

    /*
     * CLICK EVENTS
     */
    document.addEventListener('click', event => {
      const target = event.target.closest?.(
        '#prev, #next, #formatted, #raw'
      );

      if (!target) {
        return;
      }

      if (target.id === 'prev') {
        if (idx > 0) {
          idx--;
          render();
        }
        return;
      }

      if (target.id === 'next') {
        if (idx < data.length - 1) {
          idx++;
          render();
        }
        return;
      }

      if (target.id === 'formatted') {
        mode = 'formatted';

        const formatted = document.getElementById('formatted');
        const raw = document.getElementById('raw');

        if (formatted) {
          formatted.classList.add('active');
        }

        if (raw) {
          raw.classList.remove('active');
        }

        render();
        return;
      }

      if (target.id === 'raw') {
        mode = 'raw';

        const formatted = document.getElementById('formatted');
        const raw = document.getElementById('raw');

        if (raw) {
          raw.classList.add('active');
        }

        if (formatted) {
          formatted.classList.remove('active');
        }

        render();
      }
    });

    return true;
  }

  function startContentReview() {
    bindEvents();
    initializeContentReview();

    /*
     * The page may already contain the controls, or Flask/JS may insert
     * them afterwards. Observe the document rather than polling forever.
     */
    if (!document.__contentReviewObserver) {
      const observer = new MutationObserver(() => {
        if (document.getElementById('mock')) {
          initializeContentReview();
        }
      });

      observer.observe(document.documentElement, {
        childList: true,
        subtree: true
      });

      document.__contentReviewObserver = observer;
    }
  }

  /*
   * Start after parsing when possible. If the script itself is injected
   * dynamically, start immediately and let the observer handle the DOM.
   */
  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      startContentReview,
      { once: true }
    );
  } else {
    startContentReview();
  }

})();
</script>

</body>
</html>

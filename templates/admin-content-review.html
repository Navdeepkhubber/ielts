<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTSBand — Content Review</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">
<style>
:root{--bg:#eef0f3;--border:#dfe4ea;--text:#182230;--muted:#667085;--blue:#173b68;--blue-soft:#eef6ff;--green:#16804f;--green-soft:#f5fdf8;--green-border:#ccebd9}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text)}.review-page{height:100vh;display:flex;flex-direction:column;overflow:hidden}.review-toolbar{background:#fff;border-bottom:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.review-brand h1{margin:0;font:800 1.15rem/1.2 var(--font-display),Inter,system-ui,sans-serif}.review-brand p{margin:3px 0 0;color:var(--muted);font-size:.75rem}.review-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.review-controls select,.review-controls button{height:34px;border:1px solid #d5d9e0;border-radius:6px;background:#fff;color:#202124;padding:0 10px;font:inherit;font-size:.8rem}.review-controls select{min-width:120px}.review-controls button{cursor:pointer;font-weight:600}.review-controls button.active{background:var(--blue);border-color:var(--blue);color:#fff}.nav-btn{min-width:34px}.review-status{padding:5px 9px;border-radius:999px;background:#f1f3f5;color:var(--muted);font:600 .72rem var(--font-mono);white-space:nowrap}.review-layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--border)}.review-pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}.pane-head{min-height:46px;padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.pane-head strong{font:800 .84rem var(--font-display),Inter,system-ui,sans-serif}.pane-meta{color:var(--muted);font:.7rem var(--font-mono)}.pane-body{min-height:0;overflow:auto}.book-pane{background:#eef0f3;padding:18px}.book-page{margin:0 auto 18px;max-width:900px}.book-page img{display:block;width:100%;height:auto;background:#fff;border:1px solid #d7dbe1;box-shadow:0 2px 8px rgba(16,24,40,.1)}.page-error{padding:16px;border:1px solid #f0c36d;background:#fff8e8;color:#7a4b00;font-size:.8rem}.text-pane{background:#fff}.document{width:min(100%,760px);margin:0 auto;padding:22px 22px 50px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text)}.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}.doc-kicker{font-size:1.05rem;font-weight:800;line-height:1.25}.qa-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--green-border);border-radius:999px;background:#ecfbf2;color:var(--green);font-size:.72rem;font-weight:800;white-space:nowrap}.qa-badge.check{border-color:#f2d49d;background:#fff8e8;color:#a15c00}.qa-badge.legacy{border-color:#dfe3e8;background:#f5f6f8;color:#667085}.book-heading{margin:20px 0 9px;font-size:.82rem;font-weight:800;line-height:1.3;text-transform:uppercase}.book-title{margin:18px 0 8px;font-size:1.12rem;line-height:1.3;font-weight:800}.book-instruction{margin:0 0 17px;padding:12px 14px;border:1px solid #cfe2ff;border-radius:8px;background:var(--blue-soft);color:#18345b;font-size:.84rem;line-height:1.5}.book-instruction:before{content:"i";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:9px;border-radius:50%;background:#2f80ed;color:#fff;font-size:.68rem;font-weight:800}.book-paragraph{margin:0 0 14px;color:#263445;font-size:.94rem;line-height:1.58}.section-letter{position:relative;padding-left:27px}.section-letter .letter{position:absolute;left:0;font-weight:800}.question-group{margin:24px 0 22px;border:1px solid var(--green-border);border-radius:8px;overflow:hidden;background:linear-gradient(#f7fdf9,#fff)}.question-group-head{padding:14px 16px 11px;border-bottom:1px solid #dcefe3}.question-group-title{margin:0;color:var(--green);font-size:1rem;font-weight:800}.question-row{display:grid;grid-template-columns:28px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid #e8edf0;background:#fff}.question-row-number{font-size:.82rem;font-weight:800}.question-row-text{font-size:.87rem;line-height:1.5;color:#263445}.question-row-answer{height:34px;display:flex;align-items:center;justify-content:center;border:1px dashed #c7d0d9;border-radius:5px;color:#8a96a3;font-size:.68rem;font-weight:700}.inline-gap{display:inline-block;min-width:78px;margin:0 3px;border-bottom:1px solid #8a96a3}.qa-summary{margin-top:22px;padding:13px 14px;border:1px solid #d7e8fb;border-radius:8px;background:#eef6ff}.qa-summary-title{font-size:.88rem;font-weight:800;margin-bottom:7px}.qa-summary-details{display:flex;flex-wrap:wrap;gap:16px;color:#34495e;font-size:.78rem}.qa-summary-details strong{color:#182230}.legacy-content p{margin:0 0 14px;font-size:.94rem;line-height:1.58;color:#263445}.raw-content{margin:0;padding:25px 30px 60px;white-space:pre-wrap;overflow-wrap:anywhere;font:.78rem/1.65 var(--font-mono)}.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:.82rem}@media(max-width:1000px){.review-layout{grid-template-columns:1fr;overflow:auto}.review-page{height:auto;min-height:100vh;overflow:visible}.review-pane{min-height:70vh}}@media(max-width:640px){.document{padding:18px 14px 40px}.question-row{grid-template-columns:25px minmax(0,1fr)}.question-row-answer{display:none}}
</style>
</head>
<body>
<div class="review-page">
<header class="review-toolbar"><div class="review-brand"><h1>Content Review</h1><p>Original source ↔ structured IELTS content</p></div><div class="review-controls"><select id="mockSelect"><option>Loading mocks…</option></select><select id="testSelect"><option>Select test…</option></select><select id="sectionSelect"><option value="reading">Reading</option><option value="listening">Listening</option></select><button id="prevBtn" class="nav-btn">←</button><button id="nextBtn" class="nav-btn">→</button><button id="textMode" class="active">Formatted</button><button id="rawMode">Raw</button><span id="status" class="review-status">Loading…</span></div></header>
<main class="review-layout"><section class="review-pane"><div class="pane-head"><strong>Original book</strong><span id="pageLabel" class="pane-meta"></span></div><div class="pane-body book-pane" id="bookPane"></div></section><section class="review-pane"><div class="pane-head"><strong id="textTitle">Extracted content</strong><span id="questionLabel" class="pane-meta"></span></div><div class="pane-body text-pane" id="textPane"></div></section></main>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);let mocks=[],current=null,sectionData=[],index=0,mode='structured';
async function api(path){const r=await fetch(path,{credentials:'same-origin'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function gaps(v){return esc(v).replace(/\b(\d{1,2})\s*(?:[.…·]{3,}|_{3,})/g,'<span class="inline-gap"></span>')}
function instruction(v){return /^(you should|complete|choose|write|look at|do the following|answer the questions)/i.test(String(v||'').trim())}
function passageHead(v){return /^(reading passage|section|part)\s+\d+/i.test(String(v||'').trim())}
function upper(v){const s=String(v||'').trim();return /^[A-Z][A-Z\s'.,\-:()]{4,80}$/.test(s)&&s.length<=80}
function blocksHtml(blocks){const out=[];const arr=blocks||[];for(let i=0;i<arr.length;i++){const raw=String(arr[i]?.text||'').trim();if(!raw)continue;if(/^[A-H]$/.test(raw)&&i+1<arr.length){const next=String(arr[i+1]?.text||'').trim();if(next){out.push(`<p class="book-paragraph section-letter"><span class="letter">${esc(raw)}</span>${gaps(next)}</p>`);i++;continue}}if(passageHead(raw))out.push(`<div class="book-heading">${gaps(raw)}</div>`);else if(instruction(raw))out.push(`<div class="book-instruction">${gaps(raw)}</div>`);else if(i>0&&instruction(arr[i-1]?.text)&&raw.length<=100)out.push(`<h2 class="book-title">${gaps(raw)}</h2>`);else if(upper(raw))out.push(`<div class="book-heading">${gaps(raw)}</div>`);else out.push(`<p class="book-paragraph">${gaps(raw)}</p>`)}return out.join('')}
function legacyHtml(text){return String(text||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>`<p>${gaps(x)}</p>`).join('')||'<div class="empty">No extracted text available.</div>'}
function questionsHtml(questions){if(!questions?.length)return '';const first=Number(questions[0].question),last=Number(questions[questions.length-1].question);const title=Number.isFinite(first)&&Number.isFinite(last)?`Questions ${first}–${last}`:'Questions';return `<section class="question-group"><div class="question-group-head"><h3 class="question-group-title">${title}</h3></div>${questions.map(q=>`<div class="question-row"><div class="question-row-number">${esc(q.question)}</div><div class="question-row-text">${gaps(String(q.text||'').replace(/\s+/g,' ').trim())}</div><div class="question-row-answer">${esc(q.question)}</div></div>`).join('')}</section>`}
function qaHtml(qa){if(!Number.isFinite(qa?.expected_count))return '';return `<section class="qa-summary"><div class="qa-summary-title">✓ QA Summary</div><div class="qa-summary-details"><span>Detected: <strong>${qa.detected_count||0}</strong></span><span>Expected: <strong>${qa.expected_count||0}</strong></span><span>Missing: <strong>${qa.missing_questions?.length||0}</strong></span><span>Duplicates: <strong>${qa.duplicate_questions?.length||0}</strong></span><span>Unexpected: <strong>${qa.unexpected_questions?.length||0}</strong></span></div></section>`}
function pagesHtml(pages){if(!pages?.length)return '<div class="empty">No page numbers configured.</div>';return pages.map(p=>`<div class="book-page" data-page="${esc(p)}"><img src="/api/mocks/${encodeURIComponent(current.mock)}/page?page=${encodeURIComponent(p)}" alt="Original PDF page ${esc(p)}"></div>`).join('')}
function wirePages(){document.querySelectorAll('#bookPane img').forEach(img=>img.addEventListener('error',()=>{const p=img.closest('.book-page')?.dataset.page||'?';img.parentElement.innerHTML=`<div class="page-error"><strong>Could not render PDF page ${esc(p)}.</strong></div>`},{once:true}))}
async function loadMocks(){mocks=await api('/api/mocks');$('mockSelect').innerHTML=mocks.map(m=>`<option value="${esc(m.id||m.mock_id||m.name)}">${esc(m.name||m.id||m.mock_id)}</option>`).join('');await loadTests()}
async function loadTests(){const id=$('mockSelect').value;const cfg=await api('/api/mocks/'+encodeURIComponent(id));const tests=Object.keys(cfg.tests||{});$('testSelect').innerHTML=tests.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');await loadSection()}
async function loadSection(){const mock=$('mockSelect').value,test=$('testSelect').value,section=$('sectionSelect').value;if(!mock||!test)return;current={mock,test,section};try{const[content,cfg]=await Promise.all([api('/api/mocks/'+encodeURIComponent(mock)+'/tests/'+encodeURIComponent(test)+'/content'),api('/api/mocks/'+encodeURIComponent(mock)+'/tests/'+encodeURIComponent(test))]);const extracted=section==='reading'?(content.reading?.passages||[]):(content.listening?.parts||[]);const configured=section==='reading'?(cfg.reading?.passages||[]):(cfg.listening?.parts||[]);sectionData=configured.map((c,i)=>({...((extracted[i])||{}),pages:c.pages||[],label:section==='reading'?`Passage ${i+1}`:`Part ${i+1}`}));index=0;render()}catch(e){$('bookPane').innerHTML='<div class="empty">Could not load this section.</div>';$('textPane').innerHTML=`<div class="empty">${esc(e.message)}</div>`;$('status').textContent='Load failed'}}
function render(){const s=sectionData[index];const section=current?.section||'reading';if(!s){$('bookPane').innerHTML='<div class="empty">No section configured.</div>';$('textPane').innerHTML='<div class="empty">No extracted content available.</div>';return}$('pageLabel').textContent=s.pages?.length?`Pages ${s.pages.join(', ')}`:'';$('questionLabel').textContent=s.questions?.length?`${s.questions.length} detected questions`:(s.text?'Text extraction':'0 detected questions');$('textTitle').textContent=`${s.label} · ${mode==='structured'?'Formatted text':'Raw extracted text'}`;$('status').textContent=`${index+1} / ${sectionData.length}`;$('bookPane').innerHTML=pagesHtml(s.pages);wirePages();if(mode==='raw'){$('textPane').innerHTML=`<pre class="raw-content">${esc(s.text||'')}</pre>`;return}const qa=s.qa||{};const structured=Number.isFinite(qa.expected_count);const badge=structured?`<span class="qa-badge ${qa.ok?'':'check'}">${qa.ok?'✓ PASS':'! CHECK'} · ${qa.detected_count||0} / ${qa.expected_count||0} questions</span>`:`<span class="qa-badge legacy">Text extraction</span>`;const body=structured?blocksHtml(s.blocks)+questionsHtml(s.questions)+qaHtml(qa):legacyHtml(s.text);$('textPane').innerHTML=`<article class="document"><div class="doc-head"><div class="doc-kicker">${section==='reading'?'READING PASSAGE':'LISTENING SECTION'} ${index+1}</div>${badge}</div><div>${body}</div></article>`}
$('mockSelect').addEventListener('change',loadTests);$('testSelect').addEventListener('change',loadSection);$('sectionSelect').addEventListener('change',loadSection);$('prevBtn').addEventListener('click',()=>{if(index>0){index--;render()}});$('nextBtn').addEventListener('click',()=>{if(index<sectionData.length-1){index++;render()}});$('textMode').addEventListener('click',()=>{mode='structured';$('textMode').classList.add('active');$('rawMode').classList.remove('active');render()});$('rawMode').addEventListener('click',()=>{mode='raw';$('rawMode').classList.add('active');$('textMode').classList.remove('active');render()});loadMocks().catch(e=>{console.error(e);$('status').textContent='Load failed'})
})();
</script>
</body>
</html>

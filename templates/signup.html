<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — IELTSBand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/landing.css">
</head>
<body class="lp-body">
  <div class="lp-auth-wrap">
    <div class="lp-auth-card">
      <div class="wordmark">
        <span class="wordmark-badge">IB</span>
        <span class="wordmark-text">IELTSBand</span>
      </div>
      <h1>Create your account</h1>
      <p class="lp-auth-sub">Free — unlocks the mock library and your own progress history.</p>

      <div id="notice"></div>

      <button type="button" id="google-btn" class="lp-btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <div class="lp-divider">or</div>

      <form id="signup-form">
        <div class="lp-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autofocus autocomplete="name">
        </div>
        <div class="lp-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="lp-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
          <p class="lp-field-hint">At least 8 characters.</p>
        </div>
        <button type="submit" id="submit-btn" class="lp-btn lp-btn-primary">Create account</button>
      </form>

      <p class="lp-auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="/static/js/firebase-config.js"></script>
  <script>
    if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
      document.getElementById('notice').innerHTML =
        '<div class="lp-auth-notice info">Firebase isn\'t configured yet. Open the browser console ' +
        'for the real error (usually a syntax mistake in static/js/firebase-config.js), fix it, ' +
        'then reload this page. See SETUP.md.</div>';
      document.getElementById('google-btn').disabled = true;
    }
  </script>
  <script>
    const noticeEl = document.getElementById('notice');
    const googleBtn = document.getElementById('google-btn');
    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('submit-btn');

    function showNotice(kind, html) {
      noticeEl.innerHTML = `<div class="lp-auth-notice ${kind}">${html}</div>`;
    }
    function clearNotice() { noticeEl.innerHTML = ''; }

    async function postSession(idToken) {
      const res = await fetch('/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken }),
      });
      if (res.ok) {
        window.location.href = '/app';
        return true;
      }
      const data = await res.json().catch(() => ({}));
      showNotice('info', data.error || 'Something went wrong. Please try again.');
      return false;
    }

    googleBtn.addEventListener('click', async () => {
      clearNotice();
      googleBtn.disabled = true;
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        const idToken = await result.user.getIdToken();
        await postSession(idToken);
      } catch (err) {
        showNotice('info', err.message || 'Google sign-in failed.');
      } finally {
        googleBtn.disabled = false;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearNotice();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        await cred.user.updateProfile({ displayName: name });
        await cred.user.sendEmailVerification();
        // Sign out immediately -- an unverified account shouldn't get a
        // session just by existing. They log in for real after verifying.
        await firebase.auth().signOut();
        form.style.display = 'none';
        googleBtn.style.display = 'none';
        document.querySelector('.lp-divider').style.display = 'none';
        showNotice('success',
          `We sent a verification link to ${email}. Click it, then ` +
          '<a href="/login">log in</a>.');
      } catch (err) {
        const msg = err.code === 'auth/email-already-in-use'
          ? 'An account with that email already exists — try logging in instead.'
          : (err.message || 'Could not create your account. Please try again.');
        showNotice('info', msg);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>

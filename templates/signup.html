<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — IELTSBand</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/landing.css">
</head>
<body class="lp-body">
  <div class="lp-auth-wrap">
    <div class="lp-auth-card">
      <a href="https://ieltsband.com" class="wordmark" style="text-decoration:none;">
        <span class="wordmark-badge">IB</span>
        <span class="wordmark-text">IELTSBand</span>
      </a>
      <h1>Create your account</h1>
      <p class="lp-auth-sub">Free — unlocks the mock library and your own progress history.</p>

      <div id="notice"></div>

      <button type="button" id="google-btn" class="lp-btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <div class="lp-divider">or</div>

      <form id="signup-form">
        <div class="lp-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autofocus autocomplete="name">
        </div>
        <div class="lp-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="lp-field">
          <label for="password">Password</label>
          <div class="lp-password-wrap">
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            <button type="button" class="lp-password-toggle" id="password-toggle" aria-label="Show password">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.5 13.5 0 0 0 1 11s4 7 11 7a9.26 9.26 0 0 0 5.39-1.61M1 1l22 22"/>
                <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>
              </svg>
            </button>
          </div>
          <ul class="lp-password-checks" id="password-checks">
            <li id="check-length" data-check="length">
              <span class="dot"><svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M2 6l3 3 5-6"/></svg></span>
              At least 8 characters
            </li>
            <li id="check-number" data-check="number">
              <span class="dot"><svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M2 6l3 3 5-6"/></svg></span>
              One number
            </li>
            <li id="check-special" data-check="special">
              <span class="dot"><svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M2 6l3 3 5-6"/></svg></span>
              One special character
            </li>
          </ul>
        </div>
        <button type="submit" id="submit-btn" class="lp-btn lp-btn-primary">Create account</button>
      </form>

      <p class="lp-auth-switch">Already have an account? <a href="/login">Log in</a></p>
      <p class="lp-auth-contact">Need help? <a href="mailto:contact@ieltsband.com">contact@ieltsband.com</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="/static/js/firebase-config.js"></script>
  <script>
    if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
      document.getElementById('notice').innerHTML =
        '<div class="lp-auth-notice info">Firebase isn\'t configured yet. Open the browser console ' +
        'for the real error (usually a syntax mistake in static/js/firebase-config.js), fix it, ' +
        'then reload this page. See SETUP.md.</div>';
      document.getElementById('google-btn').disabled = true;
    }
  </script>
  <script>
    const noticeEl = document.getElementById('notice');
    const googleBtn = document.getElementById('google-btn');
    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('submit-btn');
    const passwordInput = document.getElementById('password');

    // Show/hide password
    const toggleBtn = document.getElementById('password-toggle');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');
    toggleBtn.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      eyeIcon.style.display = showing ? '' : 'none';
      eyeOffIcon.style.display = showing ? 'none' : '';
      toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    // Live password strength checklist
    const checks = {
      length: (v) => v.length >= 8,
      number: (v) => /[0-9]/.test(v),
      special: (v) => /[^A-Za-z0-9]/.test(v),
    };
    function passwordMeetsAllChecks(value) {
      return Object.values(checks).every((fn) => fn(value));
    }
    passwordInput.addEventListener('input', () => {
      const value = passwordInput.value;
      for (const [name, fn] of Object.entries(checks)) {
        document.getElementById(`check-${name}`).classList.toggle('met', fn(value));
      }
    });

    function showNotice(kind, html) {
      noticeEl.innerHTML = `<div class="lp-auth-notice ${kind}">${html}</div>`;
    }
    function clearNotice() { noticeEl.innerHTML = ''; }

    async function postSession(idToken) {
      const res = await fetch('/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken }),
      });
      if (res.ok) {
        window.location.href = '/app';
        return true;
      }
      const data = await res.json().catch(() => ({}));
      showNotice('info', data.error || 'Something went wrong. Please try again.');
      return false;
    }

    googleBtn.addEventListener('click', async () => {
      clearNotice();
      googleBtn.disabled = true;
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        const idToken = await result.user.getIdToken();
        await postSession(idToken);
      } catch (err) {
        showNotice('info', err.message || 'Google sign-in failed.');
      } finally {
        googleBtn.disabled = false;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearNotice();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!passwordMeetsAllChecks(password)) {
        showNotice('info', 'Your password needs to meet all three requirements below before you can continue.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      try {
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        await cred.user.updateProfile({ displayName: name });
        await cred.user.sendEmailVerification();
        // Sign out immediately -- an unverified account shouldn't get a
        // session just by existing. They log in for real after verifying.
        await firebase.auth().signOut();
        form.style.display = 'none';
        googleBtn.style.display = 'none';
        document.querySelector('.lp-divider').style.display = 'none';
        showNotice('success',
          `We sent a verification link to ${email}. Click it, then ` +
          '<a href="/login">log in</a>.');
      } catch (err) {
        const msg = err.code === 'auth/email-already-in-use'
          ? 'An account with that email already exists — try logging in instead.'
          : (err.message || 'Could not create your account. Please try again.');
        showNotice('info', msg);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
